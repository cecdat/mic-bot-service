<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- 机器人头部 -->
  <rect x="8" y="4" width="16" height="12" rx="2" fill="#1E9FFF" stroke="#0D7CE8" stroke-width="1"/>
  
  <!-- 机器人眼睛 -->
  <circle cx="12" cy="8" r="2" fill="#FFFFFF"/>
  <circle cx="20" cy="8" r="2" fill="#FFFFFF"/>
  <circle cx="12" cy="8" r="1" fill="#1E9FFF"/>
  <circle cx="20" cy="8" r="1" fill="#1E9FFF"/>
  
  <!-- 机器人嘴巴 -->
  <rect x="14" y="11" width="4" height="2" rx="1" fill="#FFFFFF"/>
  
  <!-- 机器人天线 -->
  <line x1="16" y1="4" x2="16" y2="2" stroke="#FF6B6B" stroke-width="2" stroke-linecap="round"/>
  <circle cx="16" cy="1.5" r="1" fill="#FF6B6B"/>
  
  <!-- 机器人身体 -->
  <rect x="6" y="16" width="20" height="12" rx="2" fill="#1E9FFF" stroke="#0D7CE8" stroke-width="1"/>
  
  <!-- 机器人胸部面板 -->
  <rect x="10" y="18" width="12" height="8" rx="1" fill="#FFFFFF" opacity="0.3"/>
  
  <!-- 机器人手臂 -->
  <rect x="2" y="18" width="4" height="8" rx="2" fill="#1E9FFF" stroke="#0D7CE8" stroke-width="1"/>
  <rect x="26" y="18" width="4" height="8" rx="2" fill="#1E9FFF" stroke="#0D7CE8" stroke-width="1"/>
  
  <!-- 机器人腿部 -->
  <rect x="8" y="28" width="6" height="4" rx="1" fill="#1E9FFF" stroke="#0D7CE8" stroke-width="1"/>
  <rect x="18" y="28" width="6" height="4" rx="1" fill="#1E9FFF" stroke="#0D7CE8" stroke-width="1"/>
  
  <!-- 装饰性元素 -->
  <circle cx="12" cy="22" r="1" fill="#5FB878"/>
  <circle cx="20" cy="22" r="1" fill="#5FB878"/>
</svg>
