version: '3.8'

services:
  api:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: api
    restart: unless-stopped
    ports:
      - "2003:5000"
    volumes:
      - ./run.py:/app/run.py:ro
      - ./project:/app/project:ro
      - ./init:/app/init:ro
      - ./instance:/app/instance
      - ./sql:/app/sql:ro
    entrypoint: ["python", "/app/init/init.py"]
    environment:
      FLASK_APP: run
      FLASK_ENV: production
      TZ: Asia/Shanghai
      DATABASE_URL: postgresql://user:password@db:5432/rewards_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: rewards_db
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  db:
    image: postgres:16
    container_name: postgres-db-service
    restart: unless-stopped
    environment:
      POSTGRES_DB: rewards_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      TZ: Asia/Shanghai
      POSTGRES_INITDB_ARGS: --encoding=UTF-8
      POSTGRES_ENCODING: UTF-8
    volumes:
      - ./data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d rewards_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
