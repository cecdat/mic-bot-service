version: '3.8'

services:
  api:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: api
    restart: unless-stopped
    ports:
      - "2003:5000"
    volumes:
      - ./run.py:/app/run.py:ro
      - ./project:/app/project:ro
      - ./init:/app/init:ro
      - ./config:/app/config:ro
      - ./instance:/app/instance
      - ./sql:/app/sql:ro
      - /etc/os-release:/etc/host-os-release:ro
      - /proc:/host/proc:ro
    entrypoint: ["bash", "/app/init/init.sh"]
    environment:
      FLASK_APP: run
      FLASK_ENV: production
      TZ: Asia/Shanghai
      DATABASE_URL: postgresql://user:password@db:5432/rewards_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: rewards_db
      ENABLE_WEBSOCKET: "true"   # 默认启用WebSocket支持
      SOCKETIO_ASYNC_MODE: "eventlet"  # 设置Socket.IO为eventlet模式
      LOG_LEVEL: "INFO"          # 日志级别：DEBUG, INFO, WARNING, ERROR
      HOST_HOSTNAME: ${HOST_HOSTNAME:-$(hostname)}  # 宿主机主机名，默认使用当前主机名
    pid: host  # 使用宿主机PID命名空间
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  db:
    image: docker.1ms.run/postgres:16
    container_name: postgres-db-service
    restart: unless-stopped
    environment:
      POSTGRES_DB: rewards_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      TZ: Asia/Shanghai
      POSTGRES_INITDB_ARGS: --encoding=UTF-8
      POSTGRES_ENCODING: UTF-8
    volumes:
      - ./data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d rewards_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
