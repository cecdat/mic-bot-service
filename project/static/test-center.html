<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试页面</title>
    <link rel="stylesheet" href="/static/layui/css/layui.css">
    <link rel="stylesheet" href="/static/styles.css">
    <style>
        /* 表格单元格和徽章居中显示测试 */
        .layui-table-cell {
            display: flex !important;
            align-items: center;
            justify-content: center;
            min-height: 42px;
        }
        
        .layui-table-cell .layui-badge {
            margin: 0 auto;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        
        .layui-table-cell span {
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        
        /* 修复状态图标在表格中的对齐 */
        .status-icon-group {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
    </style>
</head>
<body>
    <div class="main-content">
        <h1>测试页面</h1>
        <p>这个页面用于测试表格单元格和徽章的居中显示样式。</p>
        
        <table class="layui-table">
            <thead>
                <tr>
                    <th>测试列1</th>
                    <th>测试列2</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td><span>测试文本</span></td>
                    <td><span class="layui-badge layui-bg-blue">测试徽章</span></td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
