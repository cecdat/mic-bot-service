<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - Mic-Bot Server</title>
    <link rel="stylesheet" href="{{ url_for('frontend.static', filename='layui/css/layui.css') }}">
    <link rel="stylesheet" href="{{ url_for('frontend.static', filename='styles.css') }}">
    <style>
        .login-body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        
        .login-body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: inherit;
            filter: blur(10px);
            z-index: -1;
        }
        
        .login-wrapper {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            position: relative;
            z-index: 1;
        }
        
        .login-wrapper h2 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
            font-weight: 600;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }
        
        .layui-input {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            border-radius: 10px;
            padding: 12px 15px;
            font-size: 16px;
        }
        
        .layui-input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }
        
        .layui-input:focus {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.5);
            box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.1);
        }
        
        .layui-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-size: 16px;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }
        
        .layui-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }
        
        .layui-alert {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            border-radius: 10px;
        }
        
        .layui-form-item {
            margin-bottom: 20px;
        }
        
        .layui-form-item a {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            transition: color 0.3s ease;
        }
        
        .layui-form-item a:hover {
            color: white;
        }
    </style>
</head>
<body class="login-body">
<div class="login-wrapper">
    <h2 class="layui-timeline-title">Mic-Bot Server</h2>
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="layui-alert layui-alert-error" style="display: block; margin-bottom: 15px;">{{ messages[0] }}</div>
      {% endif %}
    {% endwith %}
    <form class="layui-form" method="post" action="{{ url_for('frontend.login') }}">
        <div class="layui-form-item">
            <input type="text" name="username" required lay-verify="required" placeholder="请输入用户名" autocomplete="off" class="layui-input">
        </div>
        <div class="layui-form-item">
            <input type="password" name="password" required lay-verify="required" placeholder="请输入密码" autocomplete="off" class="layui-input">
        </div>
        <div class="layui-form-item">
            <button class="layui-btn layui-btn-fluid" lay-submit>立即登录</button>
        </div>
        {% if not web_users %}
        <div class="layui-form-item" style="text-align: center;">
            <a href="{{ url_for('frontend.register') }}">还没有账号？立即注册</a>
        </div>
        {% endif %}
    </form>
</div>
<script src="{{ url_for('frontend.static', filename='layui/layui.js') }}"></script>
<script>
layui.use(['form'], function(){
  var form = layui.form;
});

// 动态加载Bing每日壁纸
document.addEventListener('DOMContentLoaded', function() {
    fetch('/web_api/wallpaper')
        .then(response => response.json())
        .then(data => {
            if (data.success && data.url) {
                // 设置背景图片
                document.body.style.backgroundImage = `url(${data.url})`;
                document.body.style.backgroundSize = 'cover';
                document.body.style.backgroundPosition = 'center';
                document.body.style.backgroundRepeat = 'no-repeat';
            }
        })
        .catch(error => {
            console.log('获取Bing壁纸失败，使用默认背景:', error);
        });
});
</script>
</body>
</html>
