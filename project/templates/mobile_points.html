<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>积分监控 </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        /* Windows Phone Metro风格设计 */
        * {
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #000000;
            color: #ffffff;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            overflow-x: hidden;
            /* 移动端优化 */
            -webkit-text-size-adjust: 100%;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        /* Metro风格容器 */
        .metro-container {
            padding: 20px;
            max-width: 100%;
        }
        
        /* Metro风格标题 */
        .metro-title {
            font-size: 2.5rem;
            font-weight: 300;
            color: #ffffff;
            margin-bottom: 10px;
            text-align: center;
            letter-spacing: -1px;
        }
        
        .metro-subtitle {
            font-size: 1.1rem;
            color: #a0a0a0;
            text-align: center;
            margin-bottom: 30px;
            font-weight: 300;
        }
        
        /* Metro风格网格布局 */
        .metro-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        /* Metro风格卡片 */
        .metro-tile {
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            border: 1px solid #333333;
            border-radius: 0;
            padding: 0;
            overflow: hidden;
            transition: all 0.3s ease;
            position: relative;
            min-height: 120px;
            display: flex;
            flex-direction: column;
        }
        
        .metro-tile:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border-color: #555555;
        }
        
        /* Metro风格卡片头部 */
        .metro-tile-header {
            background: linear-gradient(135deg, #0078d4 0%, #106ebe 100%);
            color: white;
            padding: 15px;
            position: relative;
            min-height: 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .metro-tile-header.warning {
            background: linear-gradient(135deg, #ff8c00 0%, #ff6b00 100%);
        }
        
        .metro-tile-header.error {
            background: linear-gradient(135deg, #d13438 0%, #b71c1c 100%);
        }
        
        .metro-tile-header.success {
            background: linear-gradient(135deg, #107c10 0%, #0e6b0e 100%);
        }
        
        .metro-tile-title {
            font-size: 0.8rem;
            font-weight: 600;
            margin: 0;
            margin-left: 30px;
            display: flex;
            align-items: center;
            gap: 6px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: calc(100% - 110px);
        }
        
        .metro-tile-subtitle {
            font-size: 0.7rem;
            opacity: 0.9;
            margin: 2px 0 0 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        
        .metro-tile-info {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 4px;
            flex-wrap: nowrap;
            min-width: 0;
            flex-shrink: 1;
            overflow: hidden;
        }
        
        .metro-tile-email {
            font-size: 0.75rem;
            opacity: 0.9;
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            min-width: 0;
        }
        
        .metro-tile-node {
            font-size: 0.7rem;
            opacity: 0.8;
            background: rgba(255, 255, 255, 0.2);
            padding: 2px 6px;
            border-radius: 8px;
            white-space: nowrap;
            flex-shrink: 1;
            min-width: 0;
            max-width: 100px;
            overflow: hidden;
            text-overflow: ellipsis;
            display: inline-block;
        }
        
        .metro-tile-badge {
            position: absolute;
            top: 12px;
            right: 40px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            padding: 3px 6px;
            border-radius: 10px;
            font-size: 0.7rem;
            font-weight: 500;
        }
        
        /* Metro风格内容区域 */
        .metro-tile-content {
            padding: 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        /* Metro风格数据行 */
        .metro-data-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #333333;
        }
        
        .metro-data-row:last-child {
            border-bottom: none;
        }

        .metro-data-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            color: #cccccc;
        }

        .metro-data-value {
            font-size: 1rem;
            font-weight: 600;
            color: #ffffff;
        }
        
        .metro-data-value.primary {
            color: #0078d4;
        }
        
        .metro-data-value.success {
            color: #107c10;
        }
        
        .metro-data-value.warning {
            color: #ff8c00;
        }
        
        .metro-data-value.error {
            color: #d13438;
        }
        
        /* Metro风格大数字显示 */
        .metro-big-number {
            font-size: 2.5rem;
            font-weight: 300;
            color: #ffffff;
            text-align: center;
            margin: 20px 0;
            line-height: 1;
        }
        
        /* 自动折叠功能 */
        .metro-tile.collapsed .metro-tile-content {
            display: none;
        }
        
        .metro-tile.collapsed {
            min-height: 60px;
        }
        
        .metro-tile-header {
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .metro-tile-header:hover {
            opacity: 0.9;
        }
        
        .metro-collapse-icon {
            position: absolute;
            top: 12px;
            left: 12px;
            font-size: 1rem;
            transition: transform 0.3s ease;
        }
        
        .metro-tile.collapsed .metro-collapse-icon {
            transform: rotate(-90deg);
        }
        
        .metro-big-number.primary {
            color: #0078d4;
        }
        
        .metro-big-number.success {
            color: #107c10;
        }
        
        .metro-big-number.warning {
            color: #ff8c00;
        }
        
        /* Metro风格状态指示器 */
        .metro-status-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 8px;
        }
        
        .metro-status-indicator.online {
            background: #107c10;
        }
        
        .metro-status-indicator.offline {
            background: #d13438;
        }
        
        .metro-status-indicator.warning {
            background: #ff8c00;
        }
        
        /* Metro风格刷新按钮 */
        .metro-refresh-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #0078d4 0%, #106ebe 100%);
            border: none;
            border-radius: 50%;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0, 120, 212, 0.4);
            transition: all 0.3s ease;
            z-index: 1000;
            /* 移动端触摸优化 */
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            touch-action: manipulation;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .metro-refresh-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 25px rgba(0, 120, 212, 0.6);
        }
        
        .metro-refresh-btn:active {
            transform: scale(0.95);
        }
        
        /* Metro风格加载动画 */
        .metro-loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 200px;
            color: #cccccc;
        }
        
        .metro-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #333333;
            border-top: 3px solid #0078d4;
            border-radius: 50%;
            animation: metro-spin 1s linear infinite;
            margin-bottom: 20px;
        }
        
        @keyframes metro-spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* Metro风格空状态 */
        .metro-empty {
            text-align: center;
            padding: 60px 20px;
            color: #666666;
        }
        
        .metro-empty i {
            font-size: 4rem;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        /* Metro风格错误状态 */
        .metro-error {
            text-align: center;
            padding: 40px 20px;
            color: #d13438;
        }
        
        .metro-error i {
            font-size: 3rem;
            margin-bottom: 15px;
        }
        
        /* Metro风格最后更新时间 */
        .metro-last-updated {
            text-align: center;
            color: #666666;
            font-size: 0.9rem;
            margin-bottom: 20px;
            padding: 10px;
            background: #1a1a1a;
            border-radius: 4px;
        }
        
        /* 响应式设计 - 移动端优化 */
        @media (max-width: 768px) {
            .metro-container {
                padding: 10px;
                margin: 0;
            }
            
            .metro-title {
                font-size: 1.8rem;
                margin-bottom: 8px;
            }
            
            .metro-subtitle {
                font-size: 1rem;
                margin-bottom: 20px;
            }
            
            .metro-grid {
                grid-template-columns: 1fr;
                gap: 12px;
                margin-bottom: 20px;
            }
            
            .metro-tile {
                min-height: 160px;
                margin-bottom: 0;
            }
            
            .metro-tile-header {
                padding: 12px;
                min-height: 50px;
            }
            
            .metro-tile-title {
                font-size: 0.9rem;
                margin-left: 30px;
                max-width: calc(100% - 90px);
            }
            
            .metro-tile-subtitle {
                font-size: 0.8rem;
            }
            
            .metro-tile-email {
                font-size: 0.8rem;
            }
            
            .metro-tile-node {
                font-size: 0.75rem;
                padding: 3px 8px;
            }
            
            .metro-tile-badge {
                font-size: 0.7rem;
                padding: 4px 8px;
                right: 35px;
                top: 8px;
            }
            
            .metro-tile-content {
                padding: 12px;
            }
            
            .metro-data-row {
                margin-bottom: 8px;
            }
            
            .metro-data-label {
                font-size: 0.75rem;
            }
            
            .metro-data-value {
                font-size: 0.9rem;
            }
            
            .metro-refresh-btn {
                bottom: 15px;
                right: 15px;
                width: 55px;
                height: 55px;
                font-size: 1.3rem;
                box-shadow: 0 4px 15px rgba(0, 120, 212, 0.4);
            }
            
            .metro-loading {
                font-size: 1rem;
            }
            
            .metro-error {
                font-size: 0.9rem;
                padding: 15px;
            }
        }
        
        /* 超小屏幕优化 */
        @media (max-width: 480px) {
            .metro-container {
                padding: 8px;
            }
            
            .metro-title {
                font-size: 1.6rem;
            }
            
            .metro-subtitle {
                font-size: 0.9rem;
            }
            
            .metro-tile {
                min-height: 140px;
            }
            
            .metro-tile-header {
                padding: 10px;
                min-height: 45px;
            }
            
            .metro-tile-title {
                font-size: 0.85rem;
            }
            
            .metro-tile-subtitle {
                font-size: 0.75rem;
            }
            
            .metro-tile-content {
                padding: 10px;
            }
            
            .metro-data-label {
                font-size: 0.7rem;
            }
            
            .metro-data-value {
                font-size: 0.85rem;
            }
            
            .metro-refresh-btn {
                width: 50px;
                height: 50px;
                font-size: 1.2rem;
                bottom: 12px;
                right: 12px;
            }
        }
        
        /* 横屏模式优化 */
        @media (max-width: 768px) and (orientation: landscape) {
            .metro-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }
            
            .metro-tile {
                min-height: 120px;
            }
            
            .metro-tile-header {
                padding: 8px;
                min-height: 40px;
            }
            
            .metro-tile-content {
                padding: 8px;
            }
        }
        
        /* Metro风格滚动条 */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #1a1a1a;
        }

        ::-webkit-scrollbar-thumb {
            background: #333333;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #555555;
        }
    </style>
</head>
<body>
    <div class="metro-container">
        <!-- Metro风格标题 -->
        <h1 class="metro-title">积分监控</h1>
        <p class="metro-subtitle">Microsoft Rewards 账户状态</p>

            <!-- 最后更新时间 -->
        <div id="last-updated" class="metro-last-updated"></div>

        <!-- Metro风格网格容器 -->
        <div id="metro-grid" class="metro-grid"></div>

        <!-- Metro风格操作按钮 -->
        <div style="position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 1000;">
            <button class="metro-refresh-btn" onclick="fetchPoints()" title="刷新数据">
                <i class="bi bi-arrow-clockwise"></i>
            </button>
            <button class="metro-refresh-btn" onclick="toggleAllTiles()" title="展开/折叠全部">
                <i class="bi bi-arrows-expand" id="toggle-all-icon"></i>
            </button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const POINTS_PER_YUAN = 179.25;
        
        // 移动端优化
        let touchStartY = 0;
        let touchStartTime = 0;
        let isRefreshing = false;
        
        // Metro风格颜色主题
        const metroColors = [
            { primary: '#0078d4', secondary: '#106ebe' }, // 蓝色
            { primary: '#107c10', secondary: '#0e6b0e' }, // 绿色
            { primary: '#ff8c00', secondary: '#ff6b00' }, // 橙色
            { primary: '#d13438', secondary: '#b71c1c' }, // 红色
            { primary: '#8764b8', secondary: '#6b46a3' }, // 紫色
            { primary: '#00bcf2', secondary: '#0099bc' }, // 青色
            { primary: '#ffb900', secondary: '#ff8c00' }, // 黄色
            { primary: '#5c2d91', secondary: '#4a1c6b' }, // 深紫
        ];

        // 计算积分价值
        function calculateValue(points) {
            if (typeof points !== 'number' || points === 0) return '¥ 0.00';
            return '¥ ' + (points / POINTS_PER_YUAN).toFixed(2);
        }

        // 截断文本
        function truncateText(text, maxLength) {
            if (!text) return '';
            if (text.length <= maxLength) return text;
            return text.substring(0, maxLength) + '...';
        }
        
        // 根据节点名称获取颜色
        function getNodeColor(nodeName) {
            if (!nodeName) return metroColors[0];
            
            // 使用节点名称的哈希值来确保相同节点总是使用相同颜色
            let hash = 0;
            for (let i = 0; i < nodeName.length; i++) {
                const char = nodeName.charCodeAt(i);
                hash = ((hash << 5) - hash) + char;
                hash = hash & hash; // 转换为32位整数
            }
            
            const colorIndex = Math.abs(hash) % metroColors.length;
            return metroColors[colorIndex];
        }
        
        // 切换卡片折叠状态
        function toggleTile(tile) {
            tile.classList.toggle('collapsed');
        }
        
        // 全展开/全折叠所有卡片
        function toggleAllTiles() {
            const tiles = document.querySelectorAll('.metro-tile');
            const toggleIcon = document.getElementById('toggle-all-icon');
            const allCollapsed = Array.from(tiles).every(tile => tile.classList.contains('collapsed'));
            
            tiles.forEach(tile => {
                if (allCollapsed) {
                    tile.classList.remove('collapsed');
                } else {
                    tile.classList.add('collapsed');
                }
            });
            
            // 更新图标
            if (allCollapsed) {
                toggleIcon.className = 'bi bi-arrows-collapse';
            } else {
                toggleIcon.className = 'bi bi-arrows-expand';
            }
        }
        
        // 获取Metro风格状态
        function getMetroStatus(account) {
            const isStale = account.is_stale;
            const isDisabled = account.desktop_status === '禁用' && account.mobile_status === '禁用';
            const isWarning = (account.desktop_status === '需要验证' || account.desktop_status === '已锁定' || 
                             account.mobile_status === '需要验证' || account.mobile_status === '已锁定');
            const isError = (account.desktop_status === '密码错误' || account.desktop_status === '登录失败' || account.desktop_status === '异常' ||
                           account.mobile_status === '密码错误' || account.mobile_status === '登录失败' || account.mobile_status === '异常');
            
            if (isDisabled) return { type: 'error', text: '禁用' };
            if (isError) return { type: 'error', text: '错误' };
            if (isWarning) return { type: 'warning', text: '警告' };
            if (isStale) return { type: 'warning', text: '未更新' };
            return { type: 'success', text: '正常' };
        }
        
        // 获取状态指示器
        function getStatusIndicator(status) {
            const indicatorClass = status === '正常' ? 'online' : 
                                 status === '警告' || status === '未更新' ? 'warning' : 'offline';
            return `<span class="metro-status-indicator ${indicatorClass}"></span>`;
        }

        // 格式化时间
        function formatTime(dateString) {
            if (!dateString) return '未知';
            const date = new Date(dateString);
            return date.toLocaleString('zh-CN', { 
                year: 'numeric',
                month: '2-digit', 
                day: '2-digit', 
                hour: '2-digit', 
                minute: '2-digit',
                second: '2-digit',
                hour12: false 
            });
        }

        // 显示加载状态
        function showLoading() {
            const container = document.getElementById('metro-grid');
            container.innerHTML = `
                <div class="metro-loading">
                    <div class="metro-spinner"></div>
                    <div>正在加载数据...</div>
                </div>
            `;
        }

        // 显示错误信息
        function showError(message) {
            const container = document.getElementById('metro-grid');
            container.innerHTML = `
                <div class="metro-error">
                    <i class="bi bi-exclamation-triangle"></i>
                    <div>${message}</div>
                </div>
            `;
        }

        // 显示空状态
        function showEmpty() {
            const container = document.getElementById('metro-grid');
            container.innerHTML = `
                <div class="metro-empty">
                    <i class="bi bi-inbox"></i>
                    <div>暂无账户数据</div>
                    <div style="margin-top: 10px; color: #888;">请检查令牌是否正确</div>
                </div>
            `;
        }
        
        // 创建Metro风格卡片
        function createMetroTile(account, colorIndex) {
            const nodeColors = getNodeColor(account.node_name);
            const status = getMetroStatus(account);
            const totalValue = calculateValue(account.total_points);
            const dailyValue = calculateValue(account.daily_gain);
            
            return `
                <div class="metro-tile collapsed" onclick="toggleTile(this)">
                    <div class="metro-tile-header ${status.type}" style="background: linear-gradient(135deg, ${nodeColors.primary} 0%, ${nodeColors.secondary} 100%);">
                        <i class="bi bi-chevron-down metro-collapse-icon"></i>
                        <div class="metro-tile-title">
                            ${getStatusIndicator(status.text)}
                            <i class="bi bi-person-circle"></i>
                            <span title="${account.email}">${truncateText(account.email, 25)}</span>
                        </div>
                        <div class="metro-tile-info">
                            <div class="metro-tile-node" title="${account.node_name || '未知节点'}">${truncateText(account.node_name || '未知节点', 30)}</div>
                        </div>
                        <div class="metro-tile-badge">${status.text}</div>
                    </div>
                    <div class="metro-tile-content">
                        <div class="metro-data-row">
                            <div class="metro-data-label">
                                <i class="bi bi-star"></i>
                                总积分
                            </div>
                            <div class="metro-data-value primary">${account.total_points || 0}</div>
                        </div>
                        
                        <div class="metro-data-row">
                            <div class="metro-data-label">
                                <i class="bi bi-currency-yen"></i>
                                总价值
                            </div>
                            <div class="metro-data-value primary">${totalValue}</div>
                        </div>
                        
                        <div class="metro-data-row">
                            <div class="metro-data-label">
                                <i class="bi bi-graph-up"></i>
                                今日收益
                            </div>
                            <div class="metro-data-value ${account.daily_gain > 0 ? 'success' : 'warning'}">${account.daily_gain || 0}</div>
                        </div>
                        
                        <div class="metro-data-row">
                            <div class="metro-data-label">
                                <i class="bi bi-currency-yen"></i>
                                今日价值
                            </div>
                            <div class="metro-data-value ${account.daily_gain > 0 ? 'success' : 'warning'}">${dailyValue}</div>
                        </div>
                        
                        <div class="metro-data-row">
                            <div class="metro-data-label">
                                <i class="bi bi-laptop"></i>
                                桌面端收益
                            </div>
                            <div class="metro-data-value ${account.desktop_gain > 0 ? 'success' : 'warning'}">${account.desktop_gain || 0}</div>
                        </div>
                        
                        <div class="metro-data-row">
                            <div class="metro-data-label">
                                <i class="bi bi-phone"></i>
                                移动端收益
                            </div>
                            <div class="metro-data-value ${account.mobile_gain > 0 ? 'success' : 'warning'}">${account.mobile_gain || 0}</div>
                        </div>
                        
                        <div class="metro-data-row">
                            <div class="metro-data-label">
                                <i class="bi bi-clock"></i>
                                最后更新
                            </div>
                            <div class="metro-data-value">${formatTime(account.last_updated)}</div>
                        </div>
                    </div>
                </div>
            `;
        }

        // 获取积分数据
        function fetchPoints() {
            showLoading();

            fetch('/web_api/mobile/get_points')
            .then(response => {
                if (!response.ok) {
                    throw new Error('服务器错误: ' + response.status);
                }
                return response.json();
            })
            .then(data => {
                const container = document.getElementById('metro-grid');
                container.innerHTML = '';

                if (!Array.isArray(data) || data.length === 0) {
                    showEmpty();
                    return;
                }

                // 更新最后更新时间
                const lastUpdated = document.getElementById('last-updated');
                lastUpdated.textContent = `最后更新: ${formatTime(new Date())}`;

                // 创建Metro风格卡片
                data.forEach((account, index) => {
                    const tileHtml = createMetroTile(account, index);
                    container.innerHTML += tileHtml;
                });
            })
            .catch(error => {
                console.error('获取数据失败:', error);
                showError(error.message);
            });
        }

        // 移动端下拉刷新
        function initMobileRefresh() {
            const container = document.querySelector('.metro-container');
            
            container.addEventListener('touchstart', function(e) {
                if (window.scrollY === 0) {
                    touchStartY = e.touches[0].clientY;
                    touchStartTime = Date.now();
                }
            }, { passive: true });
            
            container.addEventListener('touchmove', function(e) {
                if (window.scrollY === 0 && !isRefreshing) {
                    const touchY = e.touches[0].clientY;
                    const deltaY = touchY - touchStartY;
                    
                    if (deltaY > 50) {
                        // 显示下拉刷新提示
                        showRefreshHint();
                    }
                }
            }, { passive: true });
            
            container.addEventListener('touchend', function(e) {
                if (window.scrollY === 0 && !isRefreshing) {
                    const touchY = e.changedTouches[0].clientY;
                    const deltaY = touchY - touchStartY;
                    const deltaTime = Date.now() - touchStartTime;
                    
                    if (deltaY > 80 && deltaTime < 500) {
                        // 触发刷新
                        fetchPoints();
                    }
                }
            }, { passive: true });
        }
        
        // 显示刷新提示
        function showRefreshHint() {
            const hint = document.createElement('div');
            hint.id = 'refresh-hint';
            hint.style.cssText = `
                position: fixed;
                top: 20px;
                left: 50%;
                transform: translateX(-50%);
                background: rgba(0, 120, 212, 0.9);
                color: white;
                padding: 10px 20px;
                border-radius: 20px;
                font-size: 14px;
                z-index: 2000;
                transition: all 0.3s ease;
            `;
            hint.textContent = '松开刷新数据';
            document.body.appendChild(hint);
            
            setTimeout(() => {
                if (hint.parentNode) {
                    hint.parentNode.removeChild(hint);
                }
            }, 2000);
        }
        
        // 页面加载时直接获取数据
        window.onload = function() {
            fetchPoints();
            initMobileRefresh();
            
            // 设置自动刷新（每5分钟）
            setInterval(fetchPoints, 300000);
        }
    </script>
</body>
</html>
