{% extends "layout.html" %}

{% block title %}账户管理{% endblock %}
{% block page_title %}账户管理{% endblock %}

{% block content %}
<link rel="stylesheet" href="/static/table-center.css">
<div class="layui-card">
    <div class="layui-card-body">
        <!-- 筛选和操作区域 -->
        <div class="layui-form layui-form-pane" style="margin-bottom: 15px; padding: 10px; background-color: #f8f8f8; border-radius: 4px;">
            <div class="layui-row layui-col-space10">
                <div class="layui-col-md2">
                    <label class="layui-form-label" style="padding: 5px 10px; font-size: 12px;">状态</label>
                    <div class="layui-input-block">
                        <select id="statusFilter" lay-filter="statusFilter" style="height: 28px; font-size: 12px;">
                            <option value="">全部</option>
                            <option value="true">启用</option>
                            <option value="false">禁用</option>
                        </select>
                    </div>
                </div>
                <div class="layui-col-md2">
                    <label class="layui-form-label" style="padding: 5px 10px; font-size: 12px;">节点</label>
                    <div class="layui-input-block">
                        <select id="nodeFilter" lay-filter="nodeFilter" style="height: 28px; font-size: 12px;">
                            <option value="">全部</option>
                            <!-- 节点选项将通过JavaScript动态加载 -->
                        </select>
                    </div>
                </div>
                <div class="layui-col-md3">
                    <label class="layui-form-label" style="padding: 5px 10px; font-size: 12px;">邮箱</label>
                    <div class="layui-input-block">
                        <input type="text" id="emailSearch" placeholder="邮箱关键词" autocomplete="off" class="layui-input" style="height: 28px; font-size: 12px;">
                    </div>
                </div>
                <div class="layui-col-md5">
                    <div class="layui-btn-group" style="margin-top: 5px;">
                        <button class="layui-btn layui-btn-primary layui-btn-sm" id="clearFilter">
                            <i class="layui-icon layui-icon-refresh"></i> 清除
                        </button>
                        <button class="layui-btn layui-btn-primary layui-btn-sm" id="refreshTable">
                            <i class="layui-icon layui-icon-refresh"></i> 刷新
                        </button>
                        <button class="layui-btn layui-btn-sm" id="addAccount">
                            <i class="layui-icon layui-icon-add-circle"></i> 新增
                        </button>
                        <button class="layui-btn layui-btn-danger layui-btn-sm" id="batchDelete">
                            <i class="layui-icon layui-icon-delete"></i> 删除
                        </button>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 数据表格 -->
        <table class="layui-hide" id="accountTable" lay-filter="accountTable"></table>
        
        <!-- 操作栏模板 -->
        <script type="text/html" id="tableBar">
            <a class="layui-btn layui-btn-xs layui-btn-primary" lay-event="edit">编辑</a>
            <a class="layui-btn layui-btn-xs {{d.is_enabled ? 'layui-btn-warm' : 'layui-btn-normal'}}" lay-event="toggle">{{d.is_enabled ? '禁用' : '启用'}}</a>
            <a class="layui-btn layui-btn-xs layui-btn-danger" lay-event="del">删除</a>
        </script>
        
        <!-- 配置表单模板 -->
        <script type="text/html" id="account-config-form-template">
            <div style="padding: 20px 30px 0 0;">
                <form class="layui-form" lay-filter="accountForm">
                    <input type="hidden" name="id">
                    <div class="layui-form-item">
                        <label class="layui-form-label"><span class="layui-text-red">*</span> 邮箱</label>
                        <div class="layui-input-block">
                            <input type="email" name="email" required lay-verify="required|email" autocomplete="off" class="layui-input">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label"><span class="layui-text-red">*</span> 密码</label>
                        <div class="layui-input-block">
                            <input type="password" name="password" required lay-verify="required" autocomplete="off" class="layui-input" placeholder="新增时必填，编辑时可不填表示不修改">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">辅助邮箱</label>
                        <div class="layui-input-block">
                            <input type="email" name="auxiliary_email" autocomplete="off" class="layui-input" placeholder="用于接收验证码的辅助邮箱（可选）">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label"><span class="layui-text-red">*</span> 分配节点</label>
                        <div class="layui-input-block">
                            <select name="assigned_node_id" id="assigned_node_id_select" lay-verify="required">
                                <option value="">正在加载节点...</option>
                            </select>
                        </div>
                    </div>
                    <hr>
                    <div class="layui-form-item">
                        <label class="layui-form-label">代理配置</label>
                        <div class="layui-input-block">
                            <div class="layui-row layui-col-space10">
                                <div class="layui-col-md8">
                                    <input type="text" name="proxyUrl" placeholder="代理地址 (e.g., http://proxy.server)" class="layui-input">
                                </div>
                                <div class="layui-col-md4">
                                    <input type="number" name="proxyPort" placeholder="端口" class="layui-input">
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label"></label>
                        <div class="layui-input-block">
                            <div class="layui-row layui-col-space10">
                                <div class="layui-col-md6">
                                    <input type="text" name="proxyUsername" placeholder="用户名 (选填)" class="layui-input">
                                </div>
                                <div class="layui-col-md6">
                                    <input type="password" name="proxyPassword" placeholder="密码 (选填)" class="layui-input">
                                </div>
                            </div>
                        </div>
                    </div>
                    <hr>
                    <div class="layui-form-item">
                        <label class="layui-form-label">User Agents</label>
                        <div class="layui-input-block">
                            <div class="layui-row layui-col-space10">
                                <div class="layui-col-md6">
                                    <select name="user_agent_id" id="user_agent_select" lay-filter="userAgentSelect">
                                        <option value="">选择预定义User-Agent</option>
                                        <option value="custom">自定义User-Agent</option>
                                    </select>
                                </div>
                                <div class="layui-col-md6">
                                    <button type="button" class="layui-btn layui-btn-primary" onclick="refreshUserAgents()">
                                        <i class="layui-icon layui-icon-refresh"></i> 刷新
                                    </button>
                                </div>
                            </div>
                            <div class="layui-form-item" id="custom_user_agents_div" style="display: none; margin-top: 10px;">
                                <div class="layui-input-block">
                                    <textarea name="userAgents" placeholder='{"desktop": "...", "mobile": "..."}' class="layui-textarea"></textarea>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="layui-form-item layui-form-text">
                        <label class="layui-form-label">热搜词端点</label>
                        <div class="layui-input-block">
                            <textarea name="hotSearchEndpoints" placeholder='["weibo", "toutiao"]' class="layui-textarea"></textarea>
                            <div class="layui-form-mid layui-text-em">
                                请到 <a href="https://hots.237890.xyz/all" target="_blank" style="color: #FF5722;">热搜源列表</a> 中获取端点名称。
                            </div>
                        </div>
                    </div>
                    <button class="layui-btn" lay-submit lay-filter="saveAccount" id="saveAccountSubmit" style="display: none;">提交</button>
                </form>
            </div>
        </script>
    </div>
</div>

{% endblock %}

{% block custom_js %}
<script>

    // 等待DOM加载完成
    document.addEventListener('DOMContentLoaded', function() {
        const $ = layui.jquery;
        const layer = layui.layer;
        const form = layui.form;
        const table = layui.table;
        
        // 加载分配节点列表
        function loadNodes() {
            $.ajax({
                url: '/web_api/nodes',
                type: 'GET',
                success: function(res) {
                    // 检查res是否符合规范格式 {"success": true, "data": nodes_data}
                    if (res && res.success && Array.isArray(res.data)) {
                        const nodeFilter = $('#nodeFilter');
                        const assignedNodeSelect = $('#assigned_node_id_select');
                        
                        // 清空现有选项（保留第一个）
                        nodeFilter.html('<option value="">全部节点</option>');
                        assignedNodeSelect.html('<option value="">请选择节点</option>');
                        
                        // 添加节点选项
                        res.data.forEach(node => {
                            nodeFilter.append(`<option value="${node.id}">${node.node_name}</option>`);
                            assignedNodeSelect.append(`<option value="${node.id}">${node.node_name}</option>`);
                        });
                        
                        // 重新渲染表单
                        form.render('select');
                    }
                },
                error: function() {
                    layer.alert('加载节点列表失败', {icon: 2});
                }
            });
        }
        
        // 初始化表格
        const tableIns = table.render({
            elem: '#accountTable',
            url: '/web_api/bot_accounts',
            method: 'GET',
            where: {
                page: 1,
                pageSize: 10
            },
            request: {
                pageName: 'page',
                limitName: 'pageSize'
            },
            response: {
                statusName: 'code',
                statusCode: 0,
                countName: 'count',
                dataName: 'data'
            },
            parseData: function(res) {
                // 将API返回的数组格式转换为Layui期望的格式
                if (Array.isArray(res)) {
                    return {
                        "code": 0,
                        "msg": "",
                        "count": res.length,
                        "data": res
                    };
                }
                return res;
            },
            toolbar: false,
            defaultToolbar: false,
            title: '账户数据表',
            cols: [[
                {type: 'checkbox', fixed: 'left'},
                {field: 'email', title: '邮箱', minWidth: 200},
                {field: 'assigned_node_name', title: '分配节点', minWidth: 150, templet: function(d) {
                    return d.assigned_node_name || '未分配';
                }},
                {field: 'is_enabled', title: '状态', width: 100, templet: function(d) {
                    return d.is_enabled ? '<span class="layui-badge layui-bg-green">启用</span>' : '<span class="layui-badge layui-bg-gray">禁用</span>';
                }},
                {field: 'monitoring_data', title: '积分信息', minWidth: 200, templet: function(d) {
                    if (d.monitoring_data) {
                        return `<div style="font-size: 12px;">
                            <div>总积分: <span style="color: #1E9FFF; font-weight: bold;">${d.monitoring_data.total_points || 0}</span></div>
                            <div>今日获得: <span style="color: #5FB878;">${d.monitoring_data.daily_gain || 0}</span></div>
                            <div>桌面: ${d.monitoring_data.desktop_gain || 0} | 移动: ${d.monitoring_data.mobile_gain || 0}</div>
                        </div>`;
                    }
                    return '无数据';
                }},
                {field: 'monitoring_data', title: '最后更新', minWidth: 160, templet: function(d) {
                    if (d.monitoring_data && d.monitoring_data.last_updated) {
                        return new Date(d.monitoring_data.last_updated).toLocaleString('zh-CN');
                    }
                    return '-';
                }},
                {fixed: 'right', title: '操作', minWidth: 250, toolbar: '#tableBar'}
            ]],
            page: true,
            limit: 10,
            limits: [10, 20, 30, 50],
            height: 'full-210',
            text: {
                none: '暂无数据'
            },
            done: function(res, curr, count) {
                // 表格渲染完成后的回调
            }
        });
        
        // 状态切换事件
        window.toggleAccountStatus = function(accountId, currentStatus) {
            const newStatus = !currentStatus;
            $.ajax({
                url: `/web_api/bot_accounts/${accountId}/toggle`,
                type: 'POST',
                data: JSON.stringify({status: newStatus}),
                contentType: 'application/json',
                success: function(res) {
                    if (res.status === 'success') {
                        layer.msg(newStatus ? '已启用' : '已禁用', {icon: 1});
                        tableIns.reload();
                    } else {
                        layer.alert('操作失败: ' + res.message, {icon: 2});
                    }
                },
                error: function() {
                    layer.alert('请求失败', {icon: 2});
                }
            });
        };
        
        // 编辑账户
        function editAccount(accountId) {
            $.ajax({
                url: `/web_api/bot_accounts/${accountId}`,
                type: 'GET',
                success: function(res) {
                    if (res.status === 'success' && res.data) {
                        const account = res.data;
                        
                        // 填充表单数据
                        let proxyData = {};
                        try {
                            proxyData = account.proxy ? (typeof account.proxy === 'string' ? JSON.parse(account.proxy) : account.proxy) : {};
                        } catch (e) {
                            proxyData = {};
                        }
                        
                        let userAgentsData = {};
                        try {
                            userAgentsData = account.user_agents ? (typeof account.user_agents === 'string' ? JSON.parse(account.user_agents) : account.user_agents) : {};
                        } catch (e) {
                            userAgentsData = {};
                        }
                        
                        let hotSearchData = [];
                        try {
                            hotSearchData = account.hot_search_endpoints ? (typeof account.hot_search_endpoints === 'string' ? JSON.parse(account.hot_search_endpoints) : account.hot_search_endpoints) : [];
                        } catch (e) {
                            hotSearchData = [];
                        }
                        
                        form.val('accountForm', {
                            'id': account.id,
                            'email': account.email,
                            'auxiliary_email': account.auxiliary_email || '',
                            'assigned_node_id': account.assigned_node_id || '',
                            'proxyUrl': proxyData.url || '',
                            'proxyPort': proxyData.port || '',
                            'proxyUsername': proxyData.username || '',
                            'proxyPassword': proxyData.password || '',
                            'user_agent_id': account.user_agent_id || '',
                            'userAgents': JSON.stringify(userAgentsData),
                            'hotSearchEndpoints': JSON.stringify(hotSearchData)
                        });
                        
                        // 处理编辑模式下的特殊逻辑
                        if (account.id) {
                            form.verify({
                                password: function() { return true; }
                            });
                            $('[name="email"]')[0].readOnly = true;
                        }
                        
                        form.render(null, 'accountForm');
                        
                        // 打开编辑弹窗
                        layer.open({
                            type: 1,
                            title: '编辑账户',
                            content: $('#account-config-form-template').html(),
                            area: ['600px', 'auto'],
                            btn: ['保存', '取消'],
                            yes: function(index, layero) {
                                $('#saveAccountSubmit').click();
                            },
                            success: function(layero) {
                                // 重新绑定表单事件
                                const form = layui.form;
                                
                                // 重新加载节点
                                // 先获取节点选择框并设置为加载中状态
                                const assignedNodeSelect = layero.find('#assigned_node_id_select');
                                assignedNodeSelect.html('<option value="">正在加载节点...</option>');
                                form.render('select');
                                 
                                $.ajax({
                                    url: '/web_api/nodes',
                                    type: 'GET',
                                    success: function(res) {
                                        // 检查res是否符合规范格式 {"success": true, "data": nodes_data}
                                        if (res && res.success && Array.isArray(res.data)) {
                                            assignedNodeSelect.html('<option value="">请选择节点</option>');
                                            
                                            res.data.forEach(node => {
                                                const selected = account.assigned_node_id === node.id ? 'selected' : '';
                                                assignedNodeSelect.append(`<option value="${node.id}" ${selected}>${node.node_name}</option>`);
                                            });
                                            
                                            form.render('select');
                                        } else {
                                            // 数据格式不正确时的处理
                                            assignedNodeSelect.html('<option value="">加载节点失败：数据格式错误</option>');
                                            form.render('select');
                                        }
                                    },
                                    error: function(xhr, status, error) {
                                        // 请求失败时的处理
                                        assignedNodeSelect.html('<option value="">加载节点失败：' + (error || '未知错误') + '</option>');
                                        form.render('select');
                                        console.error('加载节点失败:', xhr.status, status, error);
                                    }
                                });
                                
                                // 重新加载User-Agent
                                initUserAgentSelect(layero, account.user_agent_id);
                                
                                // 绑定保存按钮事件
                                form.on('submit(saveAccount)', function(data) {
                                    const payload = data.field;
                                    let userAgents, hotSearchEndpoints;
                                    try {
                                        userAgents = payload.userAgents.trim() ? JSON.parse(payload.userAgents) : {};
                                        hotSearchEndpoints = payload.hotSearchEndpoints.trim() ? JSON.parse(payload.hotSearchEndpoints) : [];
                                    } catch (e) { 
                                        layer.alert('User Agents 或 热搜词端点 的 JSON 格式不正确！', {icon: 2}); 
                                        return false; 
                                    }

                                    const finalPayload = {
                                        id: payload.id,
                                        email: payload.email,
                                        password: payload.password,
                                        auxiliary_email: payload.auxiliary_email || null,
                                        assigned_node_id: payload.assigned_node_id ? parseInt(payload.assigned_node_id) : null,
                                        user_agent_id: payload.user_agent_id || null,
                                        proxy: {
                                            url: payload.proxyUrl,
                                            port: payload.proxyPort ? parseInt(payload.proxyPort, 10) : 0,
                                            username: payload.proxyUsername,
                                            password: payload.proxyPassword,
                                        },
                                        userAgents, hotSearchEndpoints
                                    };
                                    
                                    layer.load(1);
                                    // 使用标准 fetch API
                                    fetch('/web_api/bot_accounts', {
                                        method: 'POST', 
                                        body: JSON.stringify(finalPayload),
                                        credentials: 'same-origin', // 包含 cookie
                                        headers: {
                                            'Content-Type': 'application/json'
                                        }
                                    })
                                    .then(response => response.json())
                                    .then(result => {
                                        layer.closeAll('loading');
                                        if (result.status === 'success') {
                                            layer.closeAll('page');
                                            tableIns.reload();
                                            layer.msg('保存成功', {icon: 1});
                                            
                                            // 设置标志，通知监控面板刷新数据
                                            localStorage.setItem('accountsUpdated', 'true');
                                            // 如果当前不在监控面板页面，尝试刷新父页面
                                            if (window.parent && window.parent.location.pathname !== '/') {
                                                window.parent.location.reload();
                                            }
                                        } else {
                                            layer.alert('操作失败: ' + result.message, {icon: 2});
                                        }
                                    })
                                    .catch(error => {
                                        layer.closeAll('loading');
                                        layer.alert('请求失败: ' + error.message, {icon: 2});
                                    });
                                    return false;
                                });
                            }
                        });
                    } else {
                        layer.alert('获取账户信息失败: ' + (res.message || '未知错误'), {icon: 2});
                    }
                },
                error: function() {
                    layer.alert('请求失败', {icon: 2});
                }
            });
        }
        
        // 删除账户
        function deleteAccount(accountId, email) {
            layer.confirm(`确定要删除账户 ${email} 吗？`, {icon: 3, title:'提示'}, function(index){
                layer.load(1);
                // 使用标准 fetch API
                fetch(`/web_api/bot_accounts/${accountId}`, {
                    method: 'DELETE',
                    credentials: 'same-origin', // 包含 cookie
                    headers: {
                        'Content-Type': 'application/json'
                    }
                })
                .then(res => res.json())
                .then(result => {
                    layer.closeAll('loading');
                    if (result.status === 'success') {
                        layer.msg('删除成功', {icon: 1});
                        tableIns.reload();
                    } else {
                        layer.alert('删除失败: ' + result.message, {icon: 2});
                    }
                }).catch(e => {
                    layer.closeAll('loading');
                    layer.alert('请求失败: ' + e.message, {icon: 2});
                });
                layer.close(index);
            });
        }
        
        // 初始化表格工具条事件
        table.on('tool(accountTable)', function(obj) {
            const data = obj.data;
            if (obj.event === 'edit') {
                editAccount(data.id);
            } else if (obj.event === 'del') {
                deleteAccount(data.id, data.email);
            } else if (obj.event === 'toggle') {
                toggleAccountStatus(data.id, data.is_enabled);
            }
        });
        
        // 新增账户按钮点击事件
        $('#addAccount').on('click', function() {
            // 重置表单
            form.val('accountForm', {
                'id': '',
                'email': '',
                'password': '',
                'auxiliary_email': '',
                'assigned_node_id': '',
                'proxyUrl': '',
                'proxyPort': '',
                'proxyUsername': '',
                'proxyPassword': '',
                'user_agent_id': '',
                'userAgents': '',
                'hotSearchEndpoints': ''
            });
            
            form.render(null, 'accountForm');
            
            // 打开新增弹窗
            layer.open({
                type: 1,
                title: '新增账户',
                content: $('#account-config-form-template').html(),
                area: ['600px', 'auto'],
                btn: ['保存', '取消'],
                yes: function(index, layero) {
                    layero.find('#saveAccountSubmit').click();
                },
                success: function(layero) {
                    // 重新绑定表单事件
                    const form = layui.form;
                    
                    // 重新加载节点
                    // 先获取节点选择框并设置为加载中状态
                    const assignedNodeSelect = layero.find('#assigned_node_id_select');
                    assignedNodeSelect.html('<option value="">正在加载节点...</option>');
                    form.render('select');
                     
                    $.ajax({
                        url: '/web_api/nodes',
                        type: 'GET',
                        success: function(res) {
                            // 检查res是否符合规范格式 {"success": true, "data": nodes_data}
                            if (res && res.success && Array.isArray(res.data)) {
                                assignedNodeSelect.html('<option value="">请选择节点</option>');
                                
                                res.data.forEach(node => {
                                    assignedNodeSelect.append(`<option value="${node.id}">${node.node_name}</option>`);
                                });
                                
                                form.render('select');
                            } else {
                                // 数据格式不正确时的处理
                                assignedNodeSelect.html('<option value="">加载节点失败：数据格式错误</option>');
                                form.render('select');
                            }
                        },
                        error: function(xhr, status, error) {
                            // 请求失败时的处理
                            assignedNodeSelect.html('<option value="">加载节点失败：' + (error || '未知错误') + '</option>');
                            form.render('select');
                            console.error('加载节点失败:', xhr.status, status, error);
                        }
                    });
                    
                    // 重新加载User-Agent
                    initUserAgentSelect(layero);
                    
                    // 绑定保存按钮事件
                    form.on('submit(saveAccount)', function(data) {
                        const payload = data.field;
                        let userAgents, hotSearchEndpoints;
                        try {
                            userAgents = payload.userAgents.trim() ? JSON.parse(payload.userAgents) : {};
                            hotSearchEndpoints = payload.hotSearchEndpoints.trim() ? JSON.parse(payload.hotSearchEndpoints) : [];
                        } catch (e) { 
                            layer.alert('User Agents 或 热搜词端点 的 JSON 格式不正确！', {icon: 2}); 
                            return false; 
                        }

                        const finalPayload = {
                            id: payload.id,
                            email: payload.email,
                            password: payload.password,
                            auxiliary_email: payload.auxiliary_email || null,
                            assigned_node_id: payload.assigned_node_id ? parseInt(payload.assigned_node_id) : null,
                            user_agent_id: payload.user_agent_id || null,
                            proxy: {
                                url: payload.proxyUrl,
                                port: payload.proxyPort ? parseInt(payload.proxyPort, 10) : 0,
                                username: payload.proxyUsername,
                                password: payload.proxyPassword,
                            },
                            userAgents, hotSearchEndpoints
                        };
                        
                        layer.load(1);
                        // 使用标准 fetch API
                        fetch('/web_api/bot_accounts', {
                            method: 'POST', 
                            body: JSON.stringify(finalPayload),
                            credentials: 'same-origin', // 包含 cookie
                            headers: {
                                'Content-Type': 'application/json'
                            }
                        })
                        .then(response => response.json())
                        .then(result => {
                            layer.closeAll('loading');
                            if (result.status === 'success') {
                                layer.closeAll('page');
                                tableIns.reload();
                                layer.msg('保存成功', {icon: 1});
                            } else {
                                layer.alert('操作失败: ' + result.message, {icon: 2});
                            }
                        })
                        .catch(error => {
                            layer.closeAll('loading');
                            layer.alert('请求失败: ' + error.message, {icon: 2});
                        });
                        return false;
                    });
                }
            });
        });
        
        // 刷新表格按钮点击事件
        $('#refreshTable').on('click', function() {
            tableIns.reload();
        });
        
        // 批量删除按钮点击事件
        $('#batchDelete').on('click', function() {
            const checkStatus = table.checkStatus('accountTable');
            const data = checkStatus.data;
            if (data.length === 0) {
                layer.msg('请选择要删除的账户', {icon: 2});
                return;
            }
            
            const ids = data.map(item => item.id);
            layer.confirm(`确定要删除选中的 ${data.length} 个账户吗？`, {icon: 3, title:'提示'}, function(index){
                layer.load(1);
                
                // 使用标准 fetch API
                fetch('/web_api/bot_accounts/batch_delete', {
                    method: 'POST',
                    body: JSON.stringify({ids: ids}),
                    credentials: 'same-origin', // 包含 cookie
                    headers: {
                        'Content-Type': 'application/json'
                    }
                })
                .then(response => response.json())
                .then(result => {
                    layer.closeAll('loading');
                    if (result.status === 'success') {
                        layer.msg('删除成功', {icon: 1});
                        tableIns.reload();
                    } else {
                        layer.alert('删除失败: ' + result.message, {icon: 2});
                    }
                })
                .catch(error => {
                    layer.closeAll('loading');
                    layer.alert('请求失败: ' + error.message, {icon: 2});
                });
                
                layer.close(index);
            });
        });
        
        // 筛选相关事件
        $('#statusFilter').on('change', function() {
            applyFilters();
        });
        
        $('#nodeFilter').on('change', function() {
            applyFilters();
        });
        
        $('#emailSearch').on('keypress', function(e) {
            if (e.which === 13) {
                applyFilters();
            }
        });
        
        $('#clearFilter').on('click', function() {
            $('#statusFilter').val('');
            $('#nodeFilter').val('');
            $('#emailSearch').val('');
            form.render('select');
            applyFilters();
        });
        
        // 应用筛选条件
        function applyFilters() {
            const status = $('#statusFilter').val();
            const nodeId = $('#nodeFilter').val();
            const emailKeyword = $('#emailSearch').val().trim();
            
            tableIns.reload({
                where: {
                    status: status,
                    node_id: nodeId,
                    email: emailKeyword
                },
                page: {
                    curr: 1
                }
            });
        }
        
        // 加载节点列表
        loadNodes();
    });
    
    // 简单的测试脚本，验证JavaScript是否正常运行
    console.log('账户管理页面加载成功，JavaScript运行正常');
    
    // User-Agent相关函数
    async function initUserAgentSelect(layero, selectedUaId = null) {
        try {
            // 首先检查用户代理选择元素是否存在
            const userAgentSelect = layero ? layero.find('#user_agent_select')[0] : document.getElementById('user_agent_select');
            if (!userAgentSelect) {
                console.warn("User agent select element not found");
                return;
            }
            
            const response = await fetch('/web_api/user_agents/unused', {
                method: 'GET',
                credentials: 'same-origin',
                headers: {
                    'Content-Type': 'application/json'
                }
            });
            const data = await response.json();
            
            if (data.success && Array.isArray(data.data)) {
                // 清空现有选项（保留前两个）
                if (userAgentSelect.children && userAgentSelect.children.length > 2) {
                    while (userAgentSelect.children.length > 2) {
                        userAgentSelect.removeChild(userAgentSelect.lastChild);
                    }
                }
                
                data.data.forEach(ua => {
                    if (ua && ua.id && ua.display_name) {
                        const option = document.createElement('option');
                        option.value = ua.id;
                        option.textContent = ua.display_name;
                        if (selectedUaId && selectedUaId === ua.id) {
                            option.selected = true;
                        }
                        userAgentSelect.appendChild(option);
                    }
                });
                
                const form = layui.form;
                if (typeof form !== 'undefined' && form.render) {
                    form.render('select');
                }
            }
        } catch (e) {
            console.error("Could not populate user agent select:", e);
        }
    }
    
    function refreshUserAgents() {
        const activeLayer = layui.layer.getChildFrame('#user_agent_select', 0)[0] || document.getElementById('user_agent_select');
        if (activeLayer) {
            const layero = activeLayer.closest('.layui-layer-content') ? {
                find: function(selector) { return $(activeLayer.closest('.layui-layer-content')).find(selector); }
            } : null;
            initUserAgentSelect(layero);
        }
        layui.layer.msg('User-Agent列表已刷新', {icon: 1});
    }
    
    function setSelectedUserAgent(uaId) {
        // 这里可以根据选择的User-Agent ID设置对应的值
        // 暂时留空，后续可以根据需要实现
        console.log('Selected User-Agent ID:', uaId);
    }
</script>
