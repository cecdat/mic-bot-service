{% extends "layout.html" %}

{% block title %}账户管理{% endblock %}
{% block page_title %}账户管理{% endblock %}

{% block content %}
<link rel="stylesheet" href="/static/table-center.css">
<style>
/* 状态图标样式（和监控面板一致） */
.status-icon {
    font-size: 16px;
    margin-right: 5px;
    transition: all 0.2s ease;
}

.status-icon:hover {
    transform: scale(1.1);
}

.text-success {
    color: #5FB878 !important;
}

.text-warning {
    color: #FFB800 !important;
}

.text-danger {
    color: #FF5722 !important;
}

.text-secondary {
    color: #999 !important;
}
</style>
<div class="layui-card">
    <div class="layui-card-body">
        <!-- 筛选和操作区域 -->
        <div class="layui-form layui-form-pane" style="margin-bottom: 15px; padding: 10px; background-color: #f8f8f8; border-radius: 4px;">
            <div class="layui-row layui-col-space10">
                <div class="layui-col-md2">
                    <label class="layui-form-label" style="padding: 5px 10px; font-size: 12px;">状态</label>
                    <div class="layui-input-block">
                        <select id="statusFilter" lay-filter="statusFilter" style="height: 28px; font-size: 12px;">
                            <option value="">全部</option>
                            <option value="enabled">启用</option>
                            <option value="disabled">禁用</option>
                            <option value="normal">正常</option>
                            <option value="error">异常</option>
                        </select>
                    </div>
                </div>
                <div class="layui-col-md2">
                    <label class="layui-form-label" style="padding: 5px 10px; font-size: 12px;">节点</label>
                    <div class="layui-input-block">
                        <select id="nodeFilter" lay-filter="nodeFilter" style="height: 28px; font-size: 12px;">
                            <option value="">全部</option>
                            <!-- 节点选项将通过JavaScript动态加载 -->
                        </select>
                    </div>
                </div>
                <div class="layui-col-md3">
                    <label class="layui-form-label" style="padding: 5px 10px; font-size: 12px;">邮箱</label>
                    <div class="layui-input-block">
                        <input type="text" id="emailSearch" placeholder="邮箱关键词" autocomplete="off" class="layui-input" style="height: 28px; font-size: 12px;">
                    </div>
                </div>
                <div class="layui-col-md5">
                    <div class="layui-btn-group" style="margin-top: 5px;">
                        <button class="layui-btn layui-btn-primary layui-btn-sm" id="clearFilter">
                            <i class="layui-icon layui-icon-refresh"></i> 清除
                        </button>
                        <button class="layui-btn layui-btn-primary layui-btn-sm" id="refreshTable">
                            <i class="layui-icon layui-icon-refresh"></i> 刷新
                        </button>
                        <button class="layui-btn layui-btn-sm" id="addAccount">
                            <i class="layui-icon layui-icon-add-circle"></i> 新增
                        </button>
                        <button class="layui-btn layui-btn-danger layui-btn-sm" id="batchDelete">
                            <i class="layui-icon layui-icon-delete"></i> 删除
                        </button>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 数据表格 -->
        <table class="layui-hide" id="accountTable" lay-filter="accountTable"></table>
        
        <!-- 操作栏模板 -->
        {% raw %}
        <script type="text/html" id="tableBar">
            <a class="layui-btn layui-btn-xs layui-btn-primary" lay-event="edit">编辑</a>
            <a class="layui-btn layui-btn-xs {{# if(d.is_enabled){ }}layui-btn-warm{{# } else { }}layui-btn-normal{{# } }}" lay-event="toggle">{{# if(d.is_enabled){ }}禁用{{# } else { }}启用{{# } }}</a>
            <a class="layui-btn layui-btn-xs layui-btn-danger" lay-event="del">删除</a>
        </script>
        {% endraw %}
        
        <!-- 配置表单模板 -->
        <script type="text/html" id="account-config-form-template">
            <div style="padding: 15px;">
                <form class="layui-form" lay-filter="accountForm">
                    <input type="hidden" name="id">
                    
                    <!-- 基本信息 -->
                    <div class="layui-form-item" style="margin-bottom: 15px;">
                        <label class="layui-form-label" style="width: 80px; white-space: nowrap;"><span class="layui-text-red">*</span> 邮箱</label>
                        <div class="layui-input-block" style="margin-left: 90px;">
                            <input type="email" name="email" required lay-verify="required|email" autocomplete="off" class="layui-input">
                        </div>
                    </div>
                    
                    <div class="layui-form-item" style="margin-bottom: 15px;">
                        <label class="layui-form-label" style="width: 80px; white-space: nowrap;">密码</label>
                        <div class="layui-input-block" style="margin-left: 90px;">
                            <input type="password" name="password" autocomplete="off" class="layui-input" placeholder="密码（可选）">
                        </div>
                    </div>
                    
                    <div class="layui-form-item" style="margin-bottom: 15px;">
                        <label class="layui-form-label" style="width: 80px; white-space: nowrap;">辅助邮箱</label>
                        <div class="layui-input-block" style="margin-left: 90px;">
                            <input type="email" name="auxiliary_email" autocomplete="off" class="layui-input" placeholder="用于接收验证码的辅助邮箱（可选）">
                        </div>
                    </div>
                    
                    <div class="layui-form-item" style="margin-bottom: 15px;">
                        <label class="layui-form-label" style="width: 80px; white-space: nowrap;"><span class="layui-text-red">*</span> 分配节点</label>
                        <div class="layui-input-block" style="margin-left: 90px;">
                            <select name="assigned_node_id" id="assigned_node_id_select" lay-verify="required">
                                <option value="">正在加载节点...</option>
                            </select>
                        </div>
                    </div>
                    
                    <!-- 代理配置 -->
                    <fieldset class="layui-elem-field layui-field-title" style="margin-top: 15px; margin-bottom: 10px;">
                        <legend style="font-size: 14px;">代理配置</legend>
                    </fieldset>
                    
                    <div class="layui-form-item" style="margin-bottom: 15px;">
                        <label class="layui-form-label" style="width: 80px; white-space: nowrap;">代理地址</label>
                        <div class="layui-input-block" style="margin-left: 90px;">
                            <div class="layui-row layui-col-space5">
                                <div class="layui-col-md8">
                                    <input type="text" name="proxyUrl" placeholder="代理地址" class="layui-input">
                                </div>
                                <div class="layui-col-md4">
                                    <input type="number" name="proxyPort" placeholder="端口" class="layui-input">
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="layui-form-item" style="margin-bottom: 15px;">
                        <label class="layui-form-label" style="width: 80px; white-space: nowrap;">代理认证</label>
                        <div class="layui-input-block" style="margin-left: 90px;">
                            <div class="layui-row layui-col-space5">
                                <div class="layui-col-md6">
                                    <input type="text" name="proxyUsername" placeholder="用户名" class="layui-input">
                                </div>
                                <div class="layui-col-md6">
                                    <input type="password" name="proxyPassword" placeholder="密码" class="layui-input">
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- User Agents -->
                    <div class="layui-form-item" style="margin-bottom: 15px;">
                        <label class="layui-form-label" style="width: 80px; white-space: nowrap;">User Agents</label>
                        <div class="layui-input-block" style="margin-left: 90px;">
                            <div class="layui-row layui-col-space5">
                                <div class="layui-col-md8">
                                    <select name="user_agent_id" id="user_agent_select" lay-filter="userAgentSelect">
                                        <option value="">选择预定义User-Agent</option>
                                        <option value="custom">自定义User-Agent</option>
                                    </select>
                                </div>
                                <div class="layui-col-md4">
                                    <button type="button" class="layui-btn layui-btn-primary layui-btn-sm" onclick="refreshUserAgents()">
                                        <i class="layui-icon layui-icon-refresh"></i> 刷新
                                    </button>
                                </div>
                            </div>
                            <div class="layui-form-item" id="custom_user_agents_div" style="display: none; margin-top: 10px;">
                                <div class="layui-input-block" style="margin-left: 0;">
                                    <textarea name="userAgents" placeholder='{"desktop": "...", "mobile": "..."}' class="layui-textarea" style="height: 60px;"></textarea>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 热搜词端点 -->
                    <div class="layui-form-item layui-form-text" style="margin-bottom: 15px;">
                        <label class="layui-form-label" style="width: 80px; white-space: nowrap;">热搜词端点</label>
                        <div class="layui-input-block" style="margin-left: 90px;">
                            <textarea name="hotSearchEndpoints" placeholder='["weibo", "toutiao"]' class="layui-textarea" style="height: 60px;"></textarea>
                            <div class="layui-form-mid layui-text-em" style="font-size: 12px;">
                                请到 <a href="https://hots.237890.xyz/all" target="_blank" style="color: #FF5722;">热搜源列表</a> 中获取端点名称。
                            </div>
                        </div>
                    </div>
                    
                    <button class="layui-btn" lay-submit lay-filter="saveAccount" id="saveAccountSubmit" style="display: none;">提交</button>
                </form>
            </div>
        </script>
    </div>
</div>

{% endblock %}

{% block custom_js %}
<script>

    // 等待DOM加载完成
    document.addEventListener('DOMContentLoaded', function() {
        const $ = layui.jquery;
        const layer = layui.layer;
        const form = layui.form;
        const table = layui.table;
        
        // 加载分配节点列表
        function loadNodes() {
            $.ajax({
                url: '/web_api/nodes',
                type: 'GET',
                success: function(res) {
                    console.log('节点API返回数据:', res);
                    let nodesData = [];
                    
                    // 兼容两种数据格式
                    if (res && res.success && Array.isArray(res.data)) {
                        // 格式1: {"success": true, "data": [...]}
                        nodesData = res.data;
                    } else if (Array.isArray(res)) {
                        // 格式2: 直接数组 [...]
                        nodesData = res;
                    } else {
                        console.error('节点API返回数据格式错误:', res);
                        return;
                    }
                    
                    const nodeFilter = $('#nodeFilter');
                    const assignedNodeSelect = $('#assigned_node_id_select');
                    
                    // 清空现有选项（保留第一个）
                    nodeFilter.html('<option value="">全部节点</option>');
                    assignedNodeSelect.html('<option value="">请选择节点</option>');
                    
                    // 添加节点选项
                    nodesData.forEach(node => {
                        nodeFilter.append(`<option value="${node.id}">${node.node_name}</option>`);
                        assignedNodeSelect.append(`<option value="${node.id}">${node.node_name}</option>`);
                    });
                    
                    // 重新渲染表单
                    form.render('select');
                    console.log('节点列表加载成功，共', nodesData.length, '个节点');
                },
                error: function() {
                    layer.alert('加载节点列表失败', {icon: 2});
                }
            });
        }
        
        // 初始化表格
        const tableIns = table.render({
            elem: '#accountTable',
            url: '/web_api/bot_accounts',
            method: 'GET',
            request: {
                pageName: 'page',
                limitName: 'pageSize',
                whereName: 'where'
            },
            response: {
                statusName: 'code',
                statusCode: 0,
                countName: 'count',
                dataName: 'data'
            },
            parseData: function(res) {
                // 后端现在直接返回Layui期望的格式
                return res;
            },
            toolbar: false,
            defaultToolbar: false,
            title: '账户数据表',
            cols: [[
                {type: 'checkbox', fixed: 'left'},
                {field: 'email', title: '邮箱', minWidth: 200, templet: function(d) {
                    // 检查最后更新时间是否为当天
                    let isToday = true;
                    if (d.monitoring_data && d.monitoring_data.last_updated) {
                        const updateTime = new Date(d.monitoring_data.last_updated);
                        const now = new Date();
                        isToday = updateTime.toDateString() === now.toDateString();
                    }
                    
                    // 检查是否为当天新增的账户
                    let isNewToday = false;
                    if (d.created_at && d.created_at !== null) {
                        const createdTime = new Date(d.created_at);
                        const now = new Date();
                        isNewToday = createdTime.toDateString() === now.toDateString();
                    }
                    
                    // 如果不是当天更新，邮箱用黄色标识
                    const emailColor = isToday ? '' : 'color: #FFB800; font-weight: bold;';
                    
                    // 构建邮箱显示内容
                    let emailHtml = `<span style="${emailColor}">${d.email}</span>`;
                    
                    // 如果是当天新增的账户，添加绿色叶子图标
                    if (isNewToday) {
                        emailHtml += ` <i class="layui-icon layui-icon-leaf" style="color: #5FB878; margin-left: 5px; font-size: 14px;" title="今天新增"></i>`;
                    }
                    
                    return emailHtml;
                }},
                {field: 'assigned_node_name', title: '分配节点', minWidth: 150, templet: function(d) {
                    return d.assigned_node_name || '未分配';
                }},
                {field: 'is_enabled', title: '状态', width: 120, templet: function(d) {
                    if (!d.is_enabled) {
                        return '<span class="layui-badge layui-bg-red">禁用</span>';
                    }
                    
                    // 解析状态详情
                    let statusDetails = null;
                    if (d.monitoring_data && d.monitoring_data.status_details) {
                        try {
                            statusDetails = typeof d.monitoring_data.status_details === 'string' 
                                ? JSON.parse(d.monitoring_data.status_details) 
                                : d.monitoring_data.status_details;
                        } catch (e) {
                            statusDetails = null;
                        }
                    }
                    
                    // 生成状态图标（和监控面板一样的样式）
                    let html = '';
                    const platforms = [
                        { key: 'pc', icon: 'layui-icon-auz', name: '桌面端' },
                        { key: 'mobile', icon: 'layui-icon-cellphone', name: '移动端' }
                    ];

                    platforms.forEach(p => {
                        const details = statusDetails ? statusDetails[p.key] : null;
                        let iconClass = 'text-secondary';
                        let title = `${p.name}: 状态未知`;

                        if (details) {
                            if (details.status === true) {
                                iconClass = 'text-success';
                                title = `${p.name}: 正常 (Code: ${details.code}, ${details.message})`;
                            } else {
                                if ([1, 2].includes(details.code)) {
                                    iconClass = 'text-danger';
                                } else if ([3, 4].includes(details.code)) {
                                    iconClass = 'text-warning';
                                } else {
                                    iconClass = 'text-danger';
                                }
                                title = `${p.name}: 异常 - ${details.message} (Code: ${details.code})`;
                            }
                        }
                        html += `<i class="layui-icon ${p.icon} status-icon ${iconClass}" title="${title}" style="margin-right: 5px; font-size: 16px;"></i>`;
                    });
                    
                    return html;
                }},
                {field: 'monitoring_data', title: '总积分', width: 100, templet: function(d) {
                    if (d.monitoring_data && d.monitoring_data.total_points !== undefined) {
                        const totalPoints = d.monitoring_data.total_points || 0;
                        return `<span style="color: #1E9FFF; font-weight: bold; font-size: 14px;">${totalPoints}</span>`;
                    }
                    return '<span style="color: #999;">-</span>';
                }},
                {field: 'monitoring_data', title: '今日总计', width: 100, templet: function(d) {
                    if (d.monitoring_data && d.monitoring_data.daily_gain !== undefined) {
                        // 检查最后更新时间是否为今天
                        const lastUpdated = d.monitoring_data.last_updated;
                        let isToday = false;
                        
                        if (lastUpdated) {
                            try {
                                const updateDate = new Date(lastUpdated);
                                const today = new Date();
                                
                                // 修复时区问题：比较日期部分，忽略时间
                                const updateDateStr = updateDate.toISOString().split('T')[0];
                                const todayStr = today.toISOString().split('T')[0];
                                
                                isToday = updateDateStr === todayStr;
                            } catch (e) {
                                isToday = false;
                            }
                        }
                        
                        // 如果不是今天的数据，显示0
                        const dailyGain = isToday ? (d.monitoring_data.daily_gain || 0) : 0;
                        
                        // 今日总计为0时用黄色显示，大于0时用绿色显示
                        const color = dailyGain === 0 ? '#FFB800' : '#5FB878';
                        return `<span style="color: ${color}; font-weight: bold; font-size: 14px;">${dailyGain}</span>`;
                    }
                    return '<span style="color: #999;">-</span>';
                }},
                {field: 'monitoring_data', title: '桌面端收益', width: 100, templet: function(d) {
                    if (d.monitoring_data && d.monitoring_data.desktop_gain !== undefined) {
                        const desktopGain = d.monitoring_data.desktop_gain || 0;
                        const color = desktopGain === 0 ? '#FFB800' : '#5FB878';
                        return `<span style="color: ${color}; font-weight: bold; font-size: 14px;">${desktopGain}</span>`;
                    }
                    return '<span style="color: #999;">-</span>';
                }},
                {field: 'monitoring_data', title: '移动端收益', width: 100, templet: function(d) {
                    if (d.monitoring_data && d.monitoring_data.mobile_gain !== undefined) {
                        const mobileGain = d.monitoring_data.mobile_gain || 0;
                        const color = mobileGain === 0 ? '#FFB800' : '#5FB878';
                        return `<span style="color: ${color}; font-weight: bold; font-size: 14px;">${mobileGain}</span>`;
                    }
                    return '<span style="color: #999;">-</span>';
                }},
                {field: 'monitoring_data', title: '最后更新', minWidth: 160, templet: function(d) {
                    if (d.monitoring_data && d.monitoring_data.last_updated) {
                        const updateTime = new Date(d.monitoring_data.last_updated);
                        const now = new Date();
                        const isToday = updateTime.toDateString() === now.toDateString();
                        
                        const timeStr = updateTime.toLocaleString('zh-CN', { 
                            timeZone: 'Asia/Shanghai', 
                            hour12: false 
                        });
                        
                        if (isToday) {
                            // 当天更新：正常显示
                            return timeStr;
                        } else {
                            // 非当天更新：红色标记
                            return `<span style="color: #ff5722; font-weight: bold;">${timeStr}</span>`;
                        }
                    }
                    return '-';
                }},
                {fixed: 'right', title: '操作', minWidth: 250, toolbar: '#tableBar'}
            ]],
            page: true,
            limit: 20,
            limits: [10, 20, 30, 50],
            height: 'full-210',
            text: {
                none: '暂无数据'
            },
            done: function(res, curr, count) {
                // 表格渲染完成后的回调
            }
        });
        
        // 状态切换事件
        window.toggleAccountStatus = function(accountId, currentStatus) {
            const newStatus = !currentStatus;
            $.ajax({
                url: `/web_api/bot_accounts/${accountId}/toggle`,
                type: 'POST',
                data: JSON.stringify({status: newStatus}),
                contentType: 'application/json',
                success: function(res) {
                    if (res.status === 'success') {
                        layer.msg(newStatus ? '已启用' : '已禁用', {icon: 1});
                        tableIns.reload();
                    } else {
                        layer.alert('操作失败: ' + res.message, {icon: 2});
                    }
                },
                error: function() {
                    layer.alert('请求失败', {icon: 2});
                }
            });
        };
        
        // 编辑账户
        function editAccount(accountId) {
            $.ajax({
                url: `/web_api/bot_accounts/${accountId}`,
                type: 'GET',
                success: function(res) {
                    if (res.status === 'success' && res.data) {
                        const account = res.data;
                        
                        // 填充表单数据
                        let proxyData = {};
                        try {
                            proxyData = account.proxy ? (typeof account.proxy === 'string' ? JSON.parse(account.proxy) : account.proxy) : {};
                        } catch (e) {
                            proxyData = {};
                        }
                        
                        let userAgentsData = {};
                        try {
                            userAgentsData = account.user_agents ? (typeof account.user_agents === 'string' ? JSON.parse(account.user_agents) : account.user_agents) : {};
                        } catch (e) {
                            userAgentsData = {};
                        }
                        
                        let hotSearchData = [];
                        try {
                            hotSearchData = account.hot_search_endpoints ? (typeof account.hot_search_endpoints === 'string' ? JSON.parse(account.hot_search_endpoints) : account.hot_search_endpoints) : [];
                        } catch (e) {
                            hotSearchData = [];
                        }
                        
                        // 打开编辑弹窗
                        layer.open({
                            type: 1,
                            title: '编辑账户',
                            content: $('#account-config-form-template').html(),
                            area: ['600px', 'auto'],
                            btn: ['保存', '取消'],
                            yes: function(index, layero) {
                                $('#saveAccountSubmit').click();
                            },
                            success: function(layero) {
                                // 填充表单数据
                                form.val('accountForm', {
                                    'id': account.id,
                                    'email': account.email,
                                    'auxiliary_email': account.auxiliary_email || '',
                                    'assigned_node_id': account.assigned_node_id || '',
                                    'proxyUrl': proxyData.url || '',
                                    'proxyPort': proxyData.port || '',
                                    'proxyUsername': proxyData.username || '',
                                    'proxyPassword': proxyData.password || '',
                                    'user_agent_id': account.user_agent_id || '',
                                    'userAgents': JSON.stringify(userAgentsData),
                                    'hotSearchEndpoints': JSON.stringify(hotSearchData)
                                });
                                
                                // 处理编辑模式下的特殊逻辑
                                if (account.id) {
                                    // 安全地设置readOnly属性
                                    const emailInput = layero.find('[name="email"]')[0];
                                    if (emailInput) {
                                        emailInput.readOnly = true;
                                    }
                                }
                                
                                // 完全移除密码验证，密码字段不进行任何验证
                                const passwordInput = layero.find('[name="password"]');
                                passwordInput.removeAttr('lay-verify');
                                
                                form.render(null, 'accountForm');
                                // 重新绑定表单事件
                                // const form = layui.form; // 移除重复声明
                                
                                // 重新加载节点
                                // 先获取节点选择框并设置为加载中状态
                                const assignedNodeSelect = layero.find('#assigned_node_id_select');
                                assignedNodeSelect.html('<option value="">正在加载节点...</option>');
                                form.render('select');
                                 
                                $.ajax({
                                    url: '/web_api/nodes',
                                    type: 'GET',
                                    success: function(res) {
                                        console.log('编辑账户-节点API返回数据:', res);
                                        let nodesData = [];
                                        
                                        // 兼容两种数据格式
                                        if (res && res.success && Array.isArray(res.data)) {
                                            // 格式1: {"success": true, "data": [...]}
                                            nodesData = res.data;
                                        } else if (Array.isArray(res)) {
                                            // 格式2: 直接数组 [...]
                                            nodesData = res;
                                        } else {
                                            console.error('编辑账户-节点API返回数据格式错误:', res);

    // User-Agent相关函数
    async function initUserAgentSelect(layero, selectedUaId = null) {
        try {
            // 首先检查用户代理选择元素是否存在
            const userAgentSelect = layero ? layero.find('#user_agent_select')[0] : document.getElementById('user_agent_select');
            if (!userAgentSelect) {
                console.warn("User agent select element not found");
                return;
            }
            
            const response = await fetch('/web_api/user_agents/unused', {
                method: 'GET',
                credentials: 'same-origin',
                headers: {
                    'Content-Type': 'application/json'
                }
            });
            const data = await response.json();
            
            if (data.success && Array.isArray(data.data)) {
                // 清空现有选项（保留前两个）
                if (userAgentSelect.children && userAgentSelect.children.length > 2) {
                    while (userAgentSelect.children.length > 2) {
                        userAgentSelect.removeChild(userAgentSelect.lastChild);
                    }
                }
                
                data.data.forEach(ua => {
                    if (ua && ua.id && ua.display_name) {
                        const option = document.createElement('option');
                        option.value = ua.id;
                        option.textContent = ua.display_name;
                        if (selectedUaId && selectedUaId === ua.id) {
                            option.selected = true;
                        }
                        userAgentSelect.appendChild(option);
                    }
                });
                
                const form = layui.form;
                if (typeof form !== 'undefined' && form.render) {
                    form.render('select');
                }
            }
        } catch (e) {
            console.error("Could not populate user agent select:", e);
        }
    }
    
    function refreshUserAgents() {
        const activeLayer = layui.layer.getChildFrame('#user_agent_select', 0)[0] || document.getElementById('user_agent_select');
        if (activeLayer) {
            const layero = activeLayer.closest('.layui-layer-content') ? {
                find: function(selector) { return $(activeLayer.closest('.layui-layer-content')).find(selector); }
            } : null;
            initUserAgentSelect(layero);
        }
        layui.layer.msg('User-Agent列表已刷新', {icon: 1});
    }
