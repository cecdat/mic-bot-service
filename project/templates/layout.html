<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- CSRF令牌暂时移除，因为后端未提供该变量 -->
    <title>{% block title %}监控面板{% endblock %} - Mic-Bot Server</title>
    <link rel="stylesheet" href="{{ url_for('frontend.static', filename='layui/css/layui.css') }}">
    <link rel="stylesheet" href="{{ url_for('frontend.static', filename='styles.css') }}">
    <style>
    /* 确保页面铺满浏览器 */
    html, body {
        margin: 0 !important;
        padding: 0 !important;
        height: 100% !important;
        width: 100% !important;
        overflow-x: hidden !important;
    }
    
    /* 布局容器铺满屏幕 */
    .layui-layout {
        height: 100vh !important;
        width: 100% !important;
    }
    
    .layui-layout-admin {
        height: 100vh !important;
        width: 100% !important;
    }
    
    .layui-layout-body {
        height: 100vh !important;
        width: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
    }
    
    /* 主内容区域 */
    .layui-body {
        height: calc(100vh - 60px - 50px) !important; /* 减去header和footer高度 */
        overflow-y: auto !important;
        padding: 15px !important;
    }
    
    /* Footer样式 */
    .layui-footer {
        height: 50px !important;
        line-height: 50px !important;
        text-align: center !important;
        margin: 0 !important;
        padding: 0 !important;
    }
    
    /* 移除所有可能的空白 */
    * {
        box-sizing: border-box;
    }
    </style>
</head>
<body class="layui-layout-body">

<div class="layui-layout layui-layout-admin">
    <div class="layui-header">
        <div class="layui-logo layui-hide-xs layui-bg-black">Mic-Bot Server</div>
        <ul class="layui-nav layui-layout-right">
            <li class="layui-nav-item layui-hide-xs"><a href="javascript:;">你好, {{ session.get('username', '管理员') }}</a></li>
            <li class="layui-nav-item"><a href="{{ url_for('frontend.logout') }}">退出登录</a></li>
        </ul>
    </div>

    <div class="layui-side layui-bg-black">
        <div class="layui-side-scroll">
            <ul class="layui-nav layui-nav-tree" lay-filter="main-nav">
                <li class="layui-nav-item {% if request.path == url_for('frontend.index') %}layui-this{% endif %}">
                    <a href="{{ url_for('frontend.index') }}"><i class="layui-icon layui-icon-home"></i> 监控面板</a>
                </li>
                <li class="layui-nav-item {% if request.path == url_for('frontend.manage') %}layui-this{% endif %}">
                    <a href="{{ url_for('frontend.manage') }}"><i class="layui-icon layui-icon-user"></i> 账户管理</a>
                </li>
                <li class="layui-nav-item {% if request.path == url_for('frontend.nodes') %}layui-this{% endif %}">
                    <a href="{{ url_for('frontend.nodes') }}"><i class="layui-icon layui-icon-component"></i> 节点管理</a>
                </li>
                <li class="layui-nav-item {% if request.path == url_for('frontend.push') %}layui-this{% endif %}">
                    <a href="{{ url_for('frontend.push') }}"><i class="layui-icon layui-icon-notice"></i> 推送配置</a>
                </li>
                <li class="layui-nav-item {% if request.path == url_for('frontend.verification') %}layui-this{% endif %}">
                    <a href="{{ url_for('frontend.verification') }}"><i class="layui-icon layui-icon-vercode"></i> 验证码管理</a>
                </li>
                <li class="layui-nav-item {% if request.path == url_for('frontend.change_password') %}layui-this{% endif %}">
                    <a href="{{ url_for('frontend.change_password') }}"><i class="layui-icon layui-icon-password"></i> 修改密码</a>
                </li>
            </ul>
        </div>
    </div>

    <div class="layui-body main-content">
        {% block content %}{% endblock %}
    </div>

    <div class="layui-footer">
        Copyright &copy; 2024 Mic-Bot Server. All rights reserved.
    </div>
</div>

<script src="{{ url_for('frontend.static', filename='layui/layui.js') }}"></script>
<script>
// 初始化 LayUI 的核心模块
layui.use(['element', 'layer', 'form', 'table'], function(){
  window.element = layui.element;
  window.layer = layui.layer;
  window.form = layui.form;
  window.table = layui.table;
});

// 全局的 fetch 封装，用于处理认证
window.fetchWithAuth = async function(url, options = {}) {
  console.log('[fetchWithAuth] 调用开始, URL:', url);
  console.log('[fetchWithAuth] 请求选项:', options);

  // 简化的headers设置
  const headers = { 
    'Content-Type': 'application/json',
    ...options.headers
  };
  console.log('[fetchWithAuth] 请求头:', headers);

  try {
    // 使用fetch发送请求
    console.log('[fetchWithAuth] 发送请求...');
    const response = await fetch(url, { 
      ...options, 
      headers, 
      credentials: 'same-origin'
    });

    console.log('[fetchWithAuth] 响应状态:', response.status);

    // 处理认证失败
    if (response.status === 401) {
      console.error('[fetchWithAuth] 认证失败，重定向到登录');
      window.location.href = "{{ url_for('frontend.login') }}";
      throw new Error('Authentication failed');
    }

    // 处理非2xx响应
    if (!response.ok) {
      console.error('[fetchWithAuth] 请求失败，状态码:', response.status);
      throw new Error(`Request failed with status ${response.status}`);
    }

    console.log('[fetchWithAuth] 请求成功');
    return response;
  } catch (error) {
    console.error('[fetchWithAuth] 错误:', error);
    throw error;
  }
}
</script>
{% block custom_js %}{% endblock %}
</body>
</html>
