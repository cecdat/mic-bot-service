<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}监控面板{% endblock %} - Mic-Bot Server</title>
    <link rel="stylesheet" href="{{ url_for('frontend.static', filename='layui/css/layui.css') }}">
    <link rel="stylesheet" href="{{ url_for('frontend.static', filename='styles.css') }}">
</head>
<body class="layui-layout-body">

<div class="layui-layout layui-layout-admin">
    <div class="layui-header">
        <div class="layui-logo layui-hide-xs layui-bg-black">Mic-Bot Server</div>
        <ul class="layui-nav layui-layout-right">
            <li class="layui-nav-item layui-hide-xs"><a href="javascript:;">你好, {{ session.get('username', '管理员') }}</a></li>
            <li class="layui-nav-item"><a href="{{ url_for('frontend.logout') }}">退出登录</a></li>
        </ul>
    </div>

    <div class="layui-side layui-bg-black">
        <div class="layui-side-scroll">
            <ul class="layui-nav layui-nav-tree" lay-filter="main-nav">
                <li class="layui-nav-item {% if request.path == url_for('frontend.index') %}layui-this{% endif %}">
                    <a href="{{ url_for('frontend.index') }}"><i class="layui-icon layui-icon-home"></i> 监控面板</a>
                </li>
                <li class="layui-nav-item {% if request.path == url_for('frontend.manage') %}layui-this{% endif %}">
                    <a href="{{ url_for('frontend.manage') }}"><i class="layui-icon layui-icon-user"></i> 账户管理</a>
                </li>
                <li class="layui-nav-item {% if request.path == url_for('frontend.nodes') %}layui-this{% endif %}">
                    <a href="{{ url_for('frontend.nodes') }}"><i class="layui-icon layui-icon-component"></i> 节点管理</a>
                </li>
                <li class="layui-nav-item {% if request.path == url_for('frontend.push') %}layui-this{% endif %}">
                    <a href="{{ url_for('frontend.push') }}"><i class="layui-icon layui-icon-notice"></i> 推送配置</a>
                </li>
            </ul>
        </div>
    </div>

    <div class="layui-body main-content">
        {% block content %}{% endblock %}
    </div>

    <div class="layui-footer">
        Copyright &copy; 2024 Mic-Bot Server. All rights reserved.
    </div>
</div>

<script src="{{ url_for('frontend.static', filename='layui/layui.js') }}"></script>
<script>
// 初始化 LayUI 的核心模块
layui.use(['element', 'layer', 'form', 'table'], function(){
  window.element = layui.element;
  window.layer = layui.layer;
  window.form = layui.form;
  window.table = layui.table;

  // 全局的 fetch 封装，用于处理认证
  window.fetchWithAuth = async function(url, options = {}) {
        const headers = { ...options.headers, 'Content-Type': 'application/json' };
        const response = await fetch(url, { ...options, headers });
        if (response.status === 401 || response.redirected) {
            window.location.href = "{{ url_for('frontend.login') }}";
            throw new Error('Authentication failed');
        }
        return response;
    }
});
</script>
{% block custom_js %}{% endblock %}
</body>
</html>
