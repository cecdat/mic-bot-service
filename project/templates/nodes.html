{% extends "layout.html" %}

{% block title %}节点管理{% endblock %}
{% block page_title %}节点管理{% endblock %}

{% block content %}
<div class="layui-card">
    <div class="layui-card-body">
        <div class="layui-btn-container">
            <button class="layui-btn layui-btn-normal" id="add-node-btn"><i class="layui-icon layui-icon-add-1"></i> 新增节点</button>
        </div>
        <table class="layui-hide" id="nodes-table" lay-filter="nodesTable"></table>
    </div>
</div>

{% raw %}
<script type="text/html" id="table-actions">
    <span class="layui-badge layui-bg-warm" title="运行" {{# if(d.activity_status !== 'Idle' || d.status !== 'Online'){ }} style='opacity: 0.5; cursor: not-allowed;' {{# }}} lay-event="trigger"><i class="layui-icon layui-icon-play"></i></span>
    <span class="layui-badge layui-bg-danger" title="停止" {{# if(d.activity_status !== 'Running'){ }} style='opacity: 0.5; cursor: not-allowed;' {{# }}} lay-event="stop"><i class="layui-icon layui-icon-pause"></i></span>
    <span class="layui-badge layui-bg-primary" title="重置bot状态" lay-event="reset"><i class="layui-icon layui-icon-refresh"></i></span>
    <span class="layui-badge layui-bg-blue" title="编辑" lay-event="edit"><i class="layui-icon layui-icon-edit"></i></span>
    <span class="layui-badge layui-bg-gray" title="删除" lay-event="del"><i class="layui-icon layui-icon-delete"></i></span>
</script>
{% endraw %}


<script type="text/html" id="node-config-form-template">
    <div style="padding: 20px 30px 0 0;">
        <form class="layui-form" lay-filter="nodeForm">
            <input type="hidden" name="id">
            <div class="layui-form-item">
                <label class="layui-form-label">节点名称</label>
                <div class="layui-input-block">
                    <input type="text" name="node_name" required lay-verify="required" autocomplete="off" class="layui-input">
                </div>
            </div>
            <hr>
            <div class="layui-form-item">
                <label class="layui-form-label">调度配置</label>
                <div class="layui-input-inline" style="width: 200px;">
                    <input type="text" name="cron_schedule" placeholder="Cron表达式, e.g., 10 9,19 * * *" class="layui-input">
                </div>
                <div class="layui-form-mid">随机延迟(分)</div>
                <div class="layui-input-inline" style="width: 100px;">
                    <input type="number" name="min_sleep_minutes" placeholder="最小" class="layui-input">
                </div>
                <div class="layui-form-mid">-</div>
                <div class="layui-input-inline" style="width: 100px;">
                    <input type="number" name="max_sleep_minutes" placeholder="最大" class="layui-input">
                </div>
            </div>
            <hr>
            <div class="layui-form-item">
                <label class="layui-form-label">并发账号数</label>
                <div class="layui-input-inline" style="width: 120px;">
                    <input type="number" name="clusters" placeholder="并发数" class="layui-input">
                </div>
                <div class="layui-form-mid">搜索间隔</div>
                <div class="layui-input-inline" style="width: 120px;">
                    <input type="text" name="search_delay_min" placeholder="最小, e.g., 30s" class="layui-input">
                </div>
                <div class="layui-form-mid">-</div>
                <div class="layui-input-inline" style="width: 120px;">
                    <input type="text" name="search_delay_max" placeholder="最大, e.g., 2min" class="layui-input">
                </div>
            </div>
            <button class="layui-btn" lay-submit lay-filter="saveNode" id="saveNodeSubmit" style="display: none;">提交</button>
        </form>
    </div>
</script>
{% endblock %}


{% block custom_css %}
<style>
/* 调整分页区域样式，解决文字显示不全问题 */
.layui-table-page {
    margin-top: 15px !important;  /* 减少上边距 */
    padding: 8px 15px !important; /* 增加内边距 */
    background-color: #fafafa !important; /* 添加背景色 */
    border-top: 1px solid #e6e6e6 !important; /* 添加上边框 */
}

/* 确保分页按钮文字完整显示 */
.layui-laypage a, .layui-laypage span {
    height: 32px !important; /* 增加高度 */
    line-height: 32px !important; /* 调整行高 */
    padding: 0 12px !important; /* 增加左右内边距 */
    margin: 0 2px !important; /* 添加按钮间距 */
    border-radius: 4px !important; /* 圆角 */
    font-size: 13px !important; /* 调整字体大小 */
    min-width: 32px !important; /* 最小宽度 */
    text-align: center !important; /* 文字居中 */
    display: inline-block !important; /* 确保显示为块级元素 */
    box-sizing: border-box !important; /* 盒模型 */
}

/* 分页信息区域样式 */
.layui-laypage-count {
    margin-right: 15px !important; /* 增加右边距 */
    color: #666 !important; /* 调整颜色 */
    font-size: 13px !important; /* 调整字体大小 */
}

/* 分页跳转区域样式 */
.layui-laypage-skip {
    margin-left: 15px !important; /* 增加左边距 */
    color: #666 !important; /* 调整颜色 */
    font-size: 13px !important; /* 调整字体大小 */
}

.layui-laypage-skip input {
    width: 50px !important; /* 调整输入框宽度 */
    height: 28px !important; /* 调整输入框高度 */
    margin: 0 5px !important; /* 调整输入框间距 */
    text-align: center !important; /* 输入框文字居中 */
}

/* 分页按钮悬停效果 */
.layui-laypage a:hover {
    background-color: #1E9FFF !important;
    color: white !important;
    border-color: #1E9FFF !important;
}

/* 当前页按钮样式 */
.layui-laypage .layui-laypage-curr .layui-laypage-em {
    background-color: #1E9FFF !important;
    border-radius: 4px !important;
}

/* 禁用按钮样式 */
.layui-laypage .layui-laypage-disabled {
    color: #c2c2c2 !important;
    cursor: not-allowed !important;
}

/* 确保分页容器有足够空间 */
.layui-table-view {
    overflow: visible !important; /* 允许内容溢出 */
}

/* 表格底部区域样式 */
.layui-table-tool {
    padding: 10px 15px !important; /* 调整工具栏内边距 */
}

/* 响应式调整 */
@media screen and (max-width: 768px) {
    .layui-laypage a, .layui-laypage span {
        padding: 0 8px !important; /* 小屏幕减少内边距 */
        font-size: 12px !important; /* 小屏幕减小字体 */
    }
    
    .layui-laypage-count,
    .layui-laypage-skip {
        font-size: 12px !important; /* 小屏幕减小字体 */
    }
}
</style>
{% endblock %}

{% block custom_js %}
<script>
layui.use(['table', 'form', 'layer'], function(){
    // 移除自动刷新功能
    let tableIns; // 表格实例变量

    var table = window.table;
    var form = window.form;
    var layer = window.layer;

    tableIns = table.render({
        elem: '#nodes-table',
        url: '/web_api/nodes',
        height: 'full-160',
        cellMinWidth: 80,
        cols: [[
            {field: 'node_name', title: '节点名称', width: 150, sort: true, fixed: 'left'},
            {field: 'ip_address', title: 'IP 地址', width: 150},
            {field: 'account_count_total', title: '账户数', width: 100, align: 'center', templet: d => `<span class="layui-badge layui-bg-blue">${d.account_count_total || 0}</span>`},
            {field: 'status', title: '节点状态', width: 110, align: 'center', templet: function(d){
                if (d.status === 'Online') {
                    return `<span style="color: #5FB878;" title="在线"><i class="layui-icon layui-icon-ok-circle"></i></span>`;
                } else if (d.status === 'Offline') {
                    return `<span style="color: #FF5722;" title="离线"><i class="layui-icon layui-icon-close-fill"></i></span>`;
                } else {
                    return `<span style="color: #a0a0a0;" title="从未见过"><i class="layui-icon layui-icon-help"></i></span>`;
                }
            }},
            {field: 'activity_status', title: 'Bot状态', width: 110, align: 'center', templet: d => {
                return d.activity_status === 'Running' ? '<span class="layui-badge layui-bg-blue"><i class="layui-icon layui-icon-loading layui-anim layui-anim-rotate layui-anim-loop"></i> 运行中</span>' : '<span class="layui-badge layui-bg-gray">待机</span>';
            }},
            {field: 'last_seen', title: '上次心跳时间', sort: true, minWidth: 180, templet: d => d.last_seen ? new Date(d.last_seen).toISOString().replace('T', ' ').replace('Z', '') : 'N/A'},
            {field: 'next_run_time', title: '下次执行时间', sort: true, minWidth: 180, templet: d => d.next_run_time ? new Date(d.next_run_time).toLocaleString('zh-CN', { timeZone: 'Asia/Shanghai' }) : 'N/A'},
            {fixed: 'right', title:'操作', toolbar: '#table-actions', width: 220, align: 'center'}
        ]],
        page: true,
        parseData: function(res){
            if (res.status === 401) {
                window.location.href = "{{ url_for('frontend.login') }}";
                return;
            }
            return { "code": 0, "msg": "", "count": res.length, "data": res };
        }
    });
    


    table.on('tool(nodesTable)', function(obj){
        var data = obj.data;
        if(obj.event === 'edit'){
            openNodeModal(data);
        } else if(obj.event === 'trigger'){
            if (data.status !== 'Online') { layer.msg('节点不在线，无法触发任务！', {icon: 7}); return; }
            if (data.activity_status !== 'Idle') { layer.msg('节点正在运行任务，请稍后再试！', {icon: 7}); return; }
            triggerNode(data.id);
        } else if(obj.event === 'stop'){
            if (data.activity_status !== 'Running') { layer.msg('节点当前未在运行任务，无需停止。', {icon: 7}); return; }
            stopNode(data.id);
        } else if (obj.event === 'del') {
            deleteNode(data.id, data.node_name);
        } else if (obj.event === 'reset') {
            resetNode(data.id, data.node_name);
        }
    });

    document.getElementById('add-node-btn').addEventListener('click', function(){
        openNodeModal();
    });

    function openNodeModal(data = null) {
        layer.open({
            type: 1,
            title: data ? `编辑节点: ${data.node_name}` : '新增节点',
            area: ['700px', 'auto'],
            content: document.getElementById('node-config-form-template').innerHTML,
            btn: ['保存配置', '取消'],
            yes: function(index, layero){
                layero.find('form').find('#saveNodeSubmit').click();
            },
            success: function(layero, index){
                form.val('nodeForm', {
                    "id": data ? data.id : '',
                    "node_name": data ? data.node_name : '',
                    "cron_schedule": data ? data.cron_schedule : '10 9,13,19 * * *',
                    "min_sleep_minutes": data ? data.min_sleep_minutes : 5,
                    "max_sleep_minutes": data ? data.max_sleep_minutes : 20,
                    "clusters": data ? data.clusters : 1,
                    "search_delay_min": data ? data.search_delay_min : '30s',
                    "search_delay_max": data ? data.search_delay_max : '2min'
                });
                layero.find('[name="node_name"]')[0].readOnly = !!data;
                form.render(null, 'nodeForm');
            }
        });
    }

    form.on('submit(saveNode)', function(data){
        const payload = data.field;
        const method = payload.id ? 'PUT' : 'POST';
        
        layer.load(1);
        fetchWithAuth('/web_api/nodes', {
            method: method, body: JSON.stringify(payload)
        })
        .then(response => response.json())
        .then(result => {
            layer.closeAll('loading');
            if (result.status === 'success') {
                layer.closeAll('page');
                tableIns.reload();
                if (result.api_token) {
                    // 创建弹窗内容HTML字符串
                    const tokenHtml = `
                        <div style="padding: 20px;">
                            <div class="layui-card" style="border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);">
                                <div class="layui-card-header" style="background-color: #f7f7f7; border-bottom: 1px solid #eee;">
                                    <h3 style="margin: 0; padding: 10px 0; color: #333;">节点创建成功</h3>
                                </div>
                                <div class="layui-card-body" style="padding: 20px;">
                                    <p style="color: #ff4d4f; font-weight: bold; margin-bottom: 20px;">请立即复制并保存节点 [${result.node_name}] 的 API Token，它将只显示这一次！</p>
                                    <div style="display: flex; flex-direction: column; gap: 15px;">
                                        <input id="tokenInput" class="layui-input" value="${result.api_token}" readonly style="padding: 12px; font-size: 14px; border-radius: 4px; border: 1px solid #e6e6e6; background-color: #f9f9f9;">
                                        <button id="copyBtn" class="layui-btn layui-btn-normal" style="padding: 12px 24px; font-size: 15px; font-weight: 500; border-radius: 6px; text-align: center; min-width: 180px; transition: all 0.3s ease; background-color: #1E9FFF; color: white; border: none; line-height: 18px;">复制 API Token</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;

                    // 打开弹窗
                    layer.open({
                        type: 1,
                        title: false,  // 不显示标题栏
                        closeBtn: false,  // 不显示关闭按钮
                        area: ['480px', 'auto'],
                        content: tokenHtml,
                        btn: ['已复制保存'],
                        btnAlign: 'c',  // 按钮居中
                        shade: 0.6,  // 遮罩透明度
                        success: function(layero) {
                            // 复制按钮点击事件
                            layero.find('#copyBtn').on('click', function() {
                                const input = layero.find('#tokenInput')[0];
                                // 选择文本
                                input.select();
                                // 复制到剪贴板
                                try {
                                    document.execCommand('copy');
                                    layer.msg('复制成功！', {icon: 1, time: 1500});
                                    // 更改按钮状态
                                    layero.find('#copyBtn').text('已复制');
                                    layero.find('#copyBtn').removeClass('layui-btn-normal').addClass('layui-btn-disabled');
                                    // 确保按钮样式保持一致
                                    layero.find('#copyBtn').css({"padding": "12px 24px", "text-align": "center", "min-width": "180px", "font-size": "15px", "font-weight": "500", "border-radius": "6px", "transition": "all 0.3s ease", "background-color": "#999", "color": "white", "border": "none", "line-height": "18px"});
                                } catch (err) {
                                    layer.msg('复制失败，请手动复制', {icon: 2, time: 2000});
                                    console.error('复制失败:', err);
                                }
                            });
                        },
                        yes: function(index) {
                            layer.close(index);
                        }
                    });

                    // 移除额外的confirm弹窗
                    // 弹窗关闭时的清理
                    // layer.confirm('确认已复制Token？', {
                    //     title: '确认',
                    //     icon: 3,
                    //     btn: ['已复制', '再看一下'],
                    //     success: function(layero, idx) {
                    //         // 隐藏默认关闭按钮
                    //         layero.find('.layui-layer-close').hide();
                    //     }
                    // }, function() {
                    //     layer.close(index);
                    // }, function() {
                    //     // 什么都不做，保持弹窗打开
                    // }
                } else {
                    layer.msg('配置保存成功', {icon: 1});
                }
            } else { layer.alert('操作失败: ' + result.message, {icon: 2}); }
        })
        .catch(error => {
                layer.closeAll('loading');
                // 添加详细错误日志
                console.error('请求失败详情:', error);
                console.error('错误堆栈:', error.stack);
                layer.alert('请求失败: ' + error.message + '\n\n详细信息请查看浏览器控制台', {icon: 2});
            });
        return false;
    });

    function triggerNode(nodeId) {
        layer.confirm('确定要手动触发该节点立即执行一次任务吗？', {icon: 3, title:'提示'}, function(index){
            layer.load(1);
            fetchWithAuth(`/web_api/nodes/${nodeId}/trigger`, { method: 'POST' })
            .then(res => res.json())
            .then(result => {
                layer.closeAll('loading');
                if (result.status === 'success') {
                    layer.msg('触发指令已发送！', {icon: 1});
                    tableIns.reload();
                } else {
                    layer.alert('触发失败: ' + result.message, {icon: 2});
                }
            }).catch(e => {
                layer.closeAll('loading');
                layer.alert('请求失败: ' + e.message, {icon: 2});
            });
            layer.close(index);
        });
    }

    function stopNode(nodeId) {
        layer.confirm('确定要向该节点发送停止指令吗？（仅停止当前轮任务）', {icon: 3, title:'提示'}, function(index){
            layer.load(1);
            fetchWithAuth(`/web_api/nodes/${nodeId}/stop`, { method: 'POST' })
            .then(res => res.json())
            .then(result => {
                layer.closeAll('loading');
                if (result.status === 'success') {
                    layer.msg('停止指令已发送！', {icon: 1});
                    tableIns.reload();
                } else {
                    layer.alert('操作失败: ' + result.message, {icon: 2});
                }
            }).catch(e => {
                layer.closeAll('loading');
                layer.alert('请求失败: ' + e.message, {icon: 2});
            });
            layer.close(index);
        });
    }
    
    function deleteNode(nodeId, nodeName) {
        layer.confirm(`确定要删除节点 "${nodeName}" 吗？<br><span class="layui-text-red">所有分配给该节点的账户将会被自动置为“未分配”。</span>`, {icon: 3, title:'危险操作确认'}, function(index){
            layer.load(1);
            fetchWithAuth(`/web_api/nodes/${nodeId}`, { method: 'DELETE' })
            .then(res => res.json())
            .then(result => {
                layer.closeAll('loading');
                if (result.status === 'success') {
                    layer.msg('节点删除成功', {icon: 1});
                    tableIns.reload();
                } else {
                    layer.alert('删除失败: ' + result.message, {icon: 2});
                }
            }).catch(e => {
                layer.closeAll('loading');
                layer.alert('请求失败: ' + e.message, {icon: 2});
            });
            layer.close(index);
        });
    }

    function resetNode(nodeId, nodeName) {
        layer.confirm(`确定要重置节点 [${nodeName}] 的Bot状态吗？`, {
            icon: 3, title: '确认重置',
            btn: ['确认', '取消']
        }, function(index) {
            layer.load(1);
            fetchWithAuth(`/web_api/nodes/${nodeId}/reset`, { method: 'POST' })
                .then(response => response.json())
                .then(result => {
                    layer.closeAll('loading');
                    if (result.status === 'success') {
                        layer.msg(result.message || '节点状态已重置', { icon: 1 });
                        tableIns.reload();
                    } else {
                        layer.msg(result.message || '重置节点状态失败', { icon: 2 });
                    }
                })
                .catch(error => {
                    layer.closeAll('loading');
                    layer.msg('重置节点状态失败: ' + error.message, { icon: 2 });
                });
            layer.close(index);
        });
    }
});
</script>
{% endblock %}
