<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>修改密码 - Mic-Bot Server</title>
    <link rel="stylesheet" href="{{ url_for('frontend.static', filename='layui/css/layui.css') }}">
    <link rel="stylesheet" href="{{ url_for('frontend.static', filename='styles.css') }}">
</head>
<body>
    {% include 'layout.html' %}
    <div class="layui-body">
        <div class="layui-container" style="margin-top: 20px; display: flex; justify-content: center;">
            <div class="layui-card" style="width: 100%; max-width: 500px;">
                <div class="layui-card-header page-title">修改密码</div>
                <div class="layui-card-body">
                    {% with messages = get_flashed_messages() %}
                      {% if messages %}
                        <div class="layui-alert layui-alert-error" style="display: block; margin-bottom: 15px;">{{ messages[0] }}</div>
                      {% endif %}
                    {% endwith %}
                    <form class="layui-form" method="post" action="{{ url_for('frontend.change_password') }}">
                        <div style="margin-bottom: 20px;"></div>
                        <div class="layui-form-item">
                            <label class="layui-form-label">原密码</label>
                            <div class="layui-input-block">
                                <input type="password" name="old_password" required lay-verify="required" placeholder="请输入原密码" autocomplete="off" class="layui-input">
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <label class="layui-form-label">新密码</label>
                            <div class="layui-input-block">
                                <input type="password" name="new_password" required lay-verify="required" placeholder="请输入新密码" autocomplete="off" class="layui-input">
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <label class="layui-form-label">确认新密码</label>
                            <div class="layui-input-block">
                                <input type="password" name="confirm_new_password" required lay-verify="required" placeholder="请确认新密码" autocomplete="off" class="layui-input">
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <div class="layui-input-block" style="text-align: center;">
                                <button class="layui-btn" lay-submit style="width: 120px;">确认修改</button>
                            </div>
                        </div>
                        <div style="margin-top: 20px;"></div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script src="{{ url_for('frontend.static', filename='layui/layui.js') }}"></script>
    <script>
    layui.use(['form', 'layer', 'jquery'], function(){
      var form = layui.form;
      var layer = layui.layer;
      var $ = layui.jquery;

      // 监听表单提交
      form.on('submit', function(data){
        $.ajax({
          url: '{{ url_for('frontend.change_password') }}',
          type: 'POST',
          data: data.field,
          dataType: 'json',
          success: function(res){
            if(res.success){
              layer.msg(res.message, {icon: 1, time: 3000});
            } else {
              layer.msg(res.message, {icon: 2});
            }
          },
          error: function(){
            layer.msg('请求失败，请重试', {icon: 2});
          }
        });
        return false; // 阻止表单跳转
      });
    });
    </script>
</body>
</html>
